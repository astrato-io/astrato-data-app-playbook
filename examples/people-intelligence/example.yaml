slug: people-intelligence
title: People Intelligence
company: Northwind Telecom (fictional telecom group)
layer: people-intelligence
summary: >-
  A telecom group's Group CHRO, and a regional HR director, an HR business partner and a business-unit
  leader who each see a narrower slice of the same app, decide where attrition, workforce cost and
  skills risk sit and which retention, reskilling and restructuring interventions to fund and
  approve. Thirteen tabs on one governed layer of 20 joined HR views: workforce, retention,
  succession, privacy-safe diversity, skills, two simulators, an approvals register, a self-service
  custom report builder, an assistant over stored business questions and data operations.
industry: telecom
function: hr
persona: Group CHRO (also regional HR director, HR business partner, business-unit leader)
archetype: workbench
look: >-
  light; white cards on a grey page (#F5F5F6), one blue accent (#2B5CE6 / #1B3FA8), charcoal ink
  (#25282B), red (#D92D20) only for bad news; Inter for the UI, Roboto inside charts, Material Icons;
  white left nav with sections and a "Viewing as" persona picker at the foot; top bar with
  "Illustrative data" and "Governed · live query" badges, Export and an "Ask People Intelligence"
  button; sticky scope-and-selections bar; every card captioned with its stored business question;
  dense KPI strips; a bottom tab bar and floating ask button on phones
tabs:
  - My People Home — what needs my attention today in my scope: headline KPIs, a written briefing, attrition hotspots, cost against budget?
  - Workforce Explorer — how are headcount, movement, cost, absence and engagement moving, and where is the workforce, by any segment?
  - Talent & Retention — where is attrition rising, among whom, why, and what does it cost? (with a structured investigation of one segment)
  - Talent & Succession Risk — which critical roles have no ready-now successor, and where does key-person risk meet a high impact of loss?
  - Diversity & Inclusion — how do representation, pay, promotion and attrition differ by gender and level, with every cell under 10 people blanked?
  - Skills & Future Workforce — where are the 2028 capability gaps, who has adjacent skills, and should we build, buy or borrow?
  - Workforce Simulator — what would a retention intervention, or an FY28 demand and restructuring plan, do to attrition, headcount and cost?
  - People Actions — which interventions are proposed, awaiting my approval or delivering, and what did they return?
  - Custom report — any governed dimensions and measures as a table, bar, scatter, heat map or pivot, bookmarked, shared as a link and exported
  - Question library — the stored business questions behind the assistant, each runnable as a native table
  - Data operations — is every source feed fresh, which pipeline runs failed, and who is fixing which data issue?
  - Data & governance — how the data flows from source systems to the semantic layer, and what each role may see and do
  - Capability tour — ten capabilities, each with a "Show me" that opens the place and persona that shows it
patterns:
  - governed-business-questions
  - kpi-sparkline-comparison
  - selection-bar
  - table-sparklines
  - role-switcher
  - what-if-parameters
  - in-app-calc-engine
  - writeback-workflow
  - xlsx-export
  - preload-tabs
  - query-scheduler
  - report-builder
charts: [kpi, sparkline, bar, stacked-bar, line, combo, scatter, pie, heatmap, sankey, table, table-sparklines, pivot]
interactions: [click-to-filter, selection-bar, drill-down, tabs, role-switcher, sliders, search, compare, deep-link, chat, drag-reorder]
workflows: [maker-checker-approval, data-issue-triage, scenario-submission, saved-views]
writeback: true
exports: [xlsx]
objects: 213  # rendered in the staging smoke test across 13 tabs: the 210 catalogue objects (42 KPI values, 32 filters, charts, tables, sparklines and comparison rows) are declared in src/catalogue.js, the rest are ad-hoc; compile-check covers 217 (the 210 plus the custom report's 7 starter reports)
start_here:
  - project/src/app.js — personas and scope, governed query helper, lazy per-page compile with a vSpec cache, selection bar, drill-down, mounting, ad-hoc objects, writeback
  - project/src/builder.js — the custom report builder: state → tile spec, chip bar, field panel, sort/filter popovers, bookmarks, share link, Excel
  - project/src/catalogue.js — every native object declared as data (three-object KPI cards, switchable and drillable charts, tables with sparkline columns)
  - project/src/actions.js — the People Actions register: maker–checker approval with every step written back as an event
capabilities:
