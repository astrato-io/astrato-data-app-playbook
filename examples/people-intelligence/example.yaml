  - assistant — project/src/assistant.js:32
  - writeback-workflow — project/src/actions.js:51
  - what-if — project/src/simulator.js:37
  - excel-export — project/src/export.js:18
  - saved-views — project/src/builder.js:222
  - role-switcher — project/src/app.js:687
  - drill-down — project/src/app.js:495
  - narrative-headline — project/src/home.js:16
