stealable:
  - "Custom report builder: a pure function turns the report state (visual, ordered fields, sort, filters, row limit) into an ad-hoc tile spec for a table, bar, scatter, heat map or pivot, so the offline compile check runs it too — project/src/builder.js:59"
  - "Ad-hoc native objects at run time: a small spec becomes a tile definition with the persona scope merged into its filters, then is compiled, themed and mounted in its own selection group; the assistant, investigation, question library, simulators and report builder all use it — project/src/adhoc.js:14"
  - "One link, four data scopes: each persona's row scope is a static filter on every native object and every governed query, and objects a role is not cleared for are never mounted, so never queried — project/src/app.js:381"
  - "KPI card = native number + native sparkline in a time-series twin group (a month click never narrows the page) + one-row comparison table — project/src/catalogue.js:98"
  - "Lazy per-page compile against only the fields each object references, with the compiled and themed vSpec cached per device under a hash of its definition — project/src/app.js:178"
  - "Workflow steps written back as audit events through app.writeback, with a labelled browser fallback where the runtime cannot write — project/src/app.js:605"
  - "Query lanes with 429 backoff, a session cache, and no caching for the views the app writes to — project/src/throttle.js:134"
  - "A raster basemap laid under a scatter whose axes are pinned to a lon/lat extent, so the bubbles land on their countries — project/src/basemap.js:37"
caveats:
  - "Mock data: 20 views over MOCK_DATA PEOPLE_* tables, fixed at 30 Sep 2026. The source systems shown on the Data & governance and Data operations tabs are part of the mock architecture. The app names no company on screen; it is branded \"People Intelligence · Group HR\"."
  - "Persona scope is an app-side static filter, not row-level security: anyone who can open the layer can query outside their scope. Enforce access in the semantic layer before copying this for real data."
  - "Writeback inserts events only: People Actions steps and data-issue triage insert rows into Action Events, saved scenarios into Saved Scenarios. The action records and issue states themselves live in localStorage (people-actions-v2, people-issues-v1) over the governed seed. No smoke check exercises writeback (src/checks.js:9)."
  - "The custom report's table splits its width equally between columns (src/app.js:592), so long values truncate. Its Excel export always asks for at least 2,000 rows whatever the Rows setting, and writes a pivot as a flat table."
  - "Currency comparison rows in KPI cards clip to a red \"+\"."
  - "On visualizations 0.9 a combo's secondary-axis layer does not move when the card narrows; objects are clipped to their card in CSS (src/pi.css:658) rather than fixed."
  - "The simulators' elasticities and costs are illustrative constants listed on screen (src/simulator.js:27, src/plan.js:27), not fitted. The assistant matches stored questions by keyword overlap, not a language model."
  - "Of the layer's 229 stored questions, 61 are copied into src/questions.js for the assistant and the library; the other 168 back the catalogue's objects and are shown as card captions, but the objects are declared against layer measures in catalogue.js rather than generated from the questions."
  - "All 13 tabs preload, one page at a time after the first: landing-ready 9.4 s in staging, every object settled in about 101 s, so the smoke test needs --settle-ms 180000 --check-ms 120000."
  - "Inert leftovers: throttle.js's header describes a timetable and a prefetch.js, and its RENAMES comment describes renames the empty list does not do; prefetchSelections (throttle.js) and compileTiles (dashboard.js) are unused; palette names call the blue accent \"red\" (catalogue.js, pi.css); comments cite tools/questions.mjs, chart-questions.mjs and entities.mjs, which are not included in this repo."
  - "Not shipped: the mock-data generator and the layer-authoring scripts. layers/people-intelligence/schema/ddl.sql gives the tables; recreate the layer from layer.json."
  - "Web fonts load from a public font CDN and basemap tiles from a public tile service at run time."
  - "Runs on @astrato-io/visualizations 0.9.0 and app-runtime 0.8.0 with Vite. Checked in staging with the kit smoke test at 1440, 1280 and 1024 (213 objects rendered across 13 tabs, 9 app checks), compile-check 217/217 and vite build."
  - No screenshots are shipped yet.
  - astrato.json carries a zero placeholder semanticLayerId; layer.json's datasource is a placeholder too.
