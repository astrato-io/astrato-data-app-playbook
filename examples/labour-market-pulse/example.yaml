slug: labour-market-pulse
title: Labour Market Pulse
company: None (public ONS Labour Market Statistics)
layer: uk-labour-market
summary: >-
  The chief economist of a UK recruitment firm reads the monthly ONS labour market release and
  makes the call account directors take to clients: is the labour market tightening or loosening,
  and what does it mean for hiring and pay? Market, demand by sector, pay with a pay-award what-if,
  regions, and the month's call proposed and approved maker–checker. Built by an agent from this
  repo in a clean environment as a test run, then brought up to standard: it shows what the
  playbook produces.
industry: hr
function: strategy
persona: Chief economist, UK recruitment firm
archetype: report
look: >-
  light; navy header band (#1F2A44) with underlined tabs and an "Excel pack" button; teal (#0F766E)
  for trends and sparklines, red (#B42318) / green (#067647) only for worse and better, an amber
  "Market loosening" badge; white cards on a warm-grey page (#F4F3EF); Inter / Segoe UI /
  system-ui (Inter is not bundled), Roboto from npm inside charts; each card titled with its
  question and subtitled "Latest release" or "Average of the selected months"; a sticky selection
  bar with chips, Clear all and the snapshot basis; one screen per tab at 1440
tabs:
  - Market — is the UK labour market tightening or loosening, how far has it loosened since the 2022 peak, and where does every headline indicator stand against a quarter, a year and Feb 2020?
  - Demand — where is hiring demand falling, which sectors cut vacancies most over the year, and what share of sector vacancies does each hold?
  - Pay — what does a looser market mean for pay, are real wages still growing, is public sector pay outpacing private, and what is a pay award worth after inflation?
  - Regions — which regions are loosening fastest, and how has each region's unemployment moved since 2015?
  - Our call — what is our market call this month, and has the Head of Research approved it?
patterns:
  - governed-business-questions
  - kpi-sparkline-comparison
  - selection-bar
  - preload-tabs
  - what-if-parameters
  - query-scheduler
  - table-sparklines
  - role-switcher
  - xlsx-export
charts: [kpi, sparkline, line, bar, heatmap, table, table-sparklines]
interactions: [click-to-filter, selection-bar, tabs, sliders, compare, role-switcher, deep-link]
workflows: [maker-checker-approval]
writeback: false
exports: [xlsx]
objects: 43  # 4 Year filters + 1 Region filter, 11 on Market (4 KPIs as number + mini line, a moving-average line, a dual-axis line, a table), 8 on Demand, 12 on Pay (3 KPIs, 3 what-if numbers, 2 lines, a table), 7 on Regions, all mounted at load; plus 4 selected-period table variants mounted on a time selection
start_here:
  - project/src/app.js — boot, the governed query helper, per-tab selection groups, the latest ↔ selected-period swap, mount lanes, table refit, the hero sentence, the what-if, nine self-checks
  - project/src/catalogue.js — every object as data: its stored question, dimensions, measures, static filters, selected-period alternates and presentation
  - project/src/tiles.js — the one pre-mount path (definition → compile → operations) shared with tools/compile-adapter.mjs; static filter groups and column widths
  - project/src/workflow.js — the monthly call: draft, submit, approve or return, four-eyes rule, audit trail (browser-only)
capabilities:
  - narrative-headline — project/src/app.js:417
  - what-if — project/src/app.js:366
  - simulated-workflow — project/src/workflow.js:35
  - excel-export — project/src/export.js:30
stealable:
  - "Two selection groups per tab (charts, and KPIs, which take only the fields their series can answer), mirrored from one app-wide state by difference and only while the tab is visible — project/src/app.js:95"
  - "\"Latest release\" snapshot cards that follow a time selection: with a Year or month selected, setStaticFilterGroup drops Period Status = Latest so the card shows the average of the selected months, and the subtitle says so — project/src/app.js:264"
  - "Latest-release tables swap to a selected-period variant (plain measures instead of the Latest … measures), compiled at load and mounted into the same slot — project/src/app.js:250"
  - "A latest-release table that still draws a full-history sparkline: \"latest\" lives inside the measures (Latest Value, Latest Change on a Year Earlier), so the table carries no period filter — project/src/catalogue.js:59"
  - "Pay-award what-if on a layer parameter: the slider sets `Pay Award %` on the mounted numbers with setMeasureDefinedParameter, no remount — project/src/app.js:377"
  - "KPI comparison coloured by the sign of the stored change measure, read with the card's own selections and latest filter — project/src/app.js:231"
  - "Direct getData dimensions sent as { itemKey, label }, the shape charts send; { fieldKey: '[dimension]…' } is refused with HTTP 400 — project/src/app.js:70"
  - "Static column widths refitted to the slot after mount, on resize and on tab show, through applyRuntimeOperations, never a remount — project/src/app.js:198"
caveats:
  - "Built by an agent from this repo in a clean environment as a test run, then brought up to standard: read it as what the playbook produces, not as a hand-polished demo."
  - "Public data: ONS Labour Market Statistics, one fixed release (15 Sep 2026), Jan 2015 to Jun/Jul 2026, one row per series per month. Not live. The latest period differs by series, so every \"latest\" figure uses Period Status, never the view's maximum date."
  - "The market call is not written back. Calls and the audit trail live in localStorage (key labour-market-pulse-calls-v1, src/workflow.js:9), and the screen says so."
  - "The hero's \"above the pre-pandemic\" figure is a subtraction in the app of two governed values (src/app.js:424), and the LOOSENING / TIGHTENING badge is an app rule on the sign of the U/V change with a ±0.05 dead band (src/app.js:420), not a stored measure."
  - "Headline measures are averages of the monthly readings in context: with a Year selected a KPI shows the year's average, not its last reading (labelled on the card). Regional KPIs average the selected regions unweighted."
  - "Sector vacancies cover seven sectors only (426k of the 702k UK vacancies), so the Demand tab is not a full industry breakdown. A Geography selection applies on Regions only; other tabs grey its chip."
  - "KPIs query twice under a time selection: once for the selection, once for the static-filter swap."
  - "The sector trend reuses similar purples, so several sector lines are hard to tell apart."
  - "The questions are written from the app's own catalogue (tools/questions.mjs:45), not synced back from the stored definitions; the five owner-authored questions the app uses are restated in the catalogue, so a tile can drift from its stored question. The header of questions.mjs names a src/questions.js and a tools/sync-questions.mjs that do not exist."
  - "The Excel Definitions sheet uses notes written in the app (src/export.js:9), not the layer's descriptions; the Pay sheet holds only the three pay KPIs. Export with a Sector selection is untested."
  - "The pay and regional tables scroll inside their cards at 1440."
  - "Inert leftovers: throttle.js exports a prefetch helper nothing calls, and its header still mentions a timetable and a prefetch.js."
  - "A library console error on visualizations 0.9 (TypeError reading 'reduce' in the table's pivotRowDimensionsAsColumns) is allow-listed in tools/smoke-allow.txt; the table still renders. The allow-list's second line matches any \"visualization reported an error\", so it would hide other object errors too."
  - "Checked in staging: smoke test PASS at 1440, 1280 and 1024, 43 objects, landing-ready in about 4–5 s, 9 app checks (a selection on each data tab, a Year that holds across tabs, the Excel pack with a Year selected, the what-if, the workflow read-only); compile-check 47/47 (43 objects and the 4 table variants); build passes."
  - Runs on @astrato-io/visualizations 0.9.0 and app-runtime 0.8.0 with Vite.
  - astrato.json carries a zero placeholder semanticLayerId; layer.json's datasource is a placeholder too.
