<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corvo Stock Rotation</title>
    <meta name="description" content="Corvo: stock rotation options on illustrative synthetic data." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Brand headline (Antonio) and body (Inter) fonts; Roboto comes from @fontsource in src/main.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash__inner">
        <div class="splash__kicker">CORVO</div>
        <div class="splash__title">Stock <em>rotation.</em></div>
        <div class="splash__road" id="splash-coin"><i></i><b>◆</b></div>
        <div class="splash__status" id="splash-status">Loading stock…</div>
        <div class="splash__by"><span>by</span><img src="/astrato-logo-white.svg" alt="Astrato" /></div>
      </div>
    </div>
    <div id="root"><main class="boot"></main></div>
  </body>
</html>
