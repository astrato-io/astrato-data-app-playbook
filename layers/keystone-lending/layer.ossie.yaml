        ai_context:
          instructions: Employment status declared on the application.
      - name: Policy Breaches
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"POLICY_BREACHES"'
      - name: Proposal Upheld
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PROPOSAL_UPHELD"'
      - name: Application Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPLICATION_DATE"'
      - name: Days To Decision
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAYS_TO_DECISION"'
      - name: Requested Amount
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"REQUESTED_AMOUNT"'
      - name: Application Month
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPLICATION_MONTH_LABEL"'
        dimension: {}
        description: Month the application was submitted (yyyy-mm).
        ai_context:
          instructions: Month the application was submitted (yyyy-mm).
      - name: Expense To Income
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPENSE_TO_INCOME"'
      - name: Essential Expenses
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ESSENTIAL_EXPENSES"'
      - name: Monthly Net Income
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"MONTHLY_NET_INCOME"'
      - name: Proposed Repayment
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PROPOSED_REPAYMENT"'
      - name: Stressed Repayment
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STRESSED_REPAYMENT"'
      - name: Application Quarter
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPLICATION_QUARTER"'
        dimension: {}
        description: Calendar quarter the application was submitted (yyyy-Qn).
        ai_context:
          instructions: Calendar quarter the application was submitted (yyyy-Qn).
      - name: Discretionary Spend
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DISCRETIONARY_SPEND"'
      - name: Stressed Disposable
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STRESSED_DISPOSABLE"'
      - name: Affordability Result
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AFFORDABILITY_RESULT"'
        dimension: {}
        description: 'Default-policy affordability outcome: Pass (0 breaches), Marginal (1), Fail (2+).'
        ai_context:
          instructions: 'Default-policy affordability outcome: Pass (0 breaches), Marginal (1), Fail (2+).'
      - name: Disposable After Loan
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DISPOSABLE_AFTER_LOAN"'
      - name: Existing Debt Payments
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXISTING_DEBT_PAYMENTS"'
      - name: Application Month Label
        expression:
          dialects:
