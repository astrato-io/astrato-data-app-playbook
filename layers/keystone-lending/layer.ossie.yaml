  - name: Workflow Events
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."LENDING_WORKFLOW_EVENTS"'
    fields:
      - name: Role
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ROLE"'
      - name: Step
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STEP"'
      - name: Actor
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ACTOR"'
      - name: Action
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ACTION"'
      - name: Step No
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STEP_NO"'
      - name: Event Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EVENT_DATE"'
      - name: Applicant Id
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPLICANT_ID"'
      - name: Workflow Step
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STEP"'
        dimension: {}
        description: Audit-trail step.
        ai_context:
          instructions: Audit-trail step.
relationships:
  - name: relationship_1_Workflow Events_to_Applications
    from: Workflow Events
    to: Applications
    from_columns:
      - Applicant Id
    to_columns:
      - Applicant Id
metrics:
  - name: Applications
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: COUNT(DISTINCT "v1_APPLICANT_ID")
    description: Number of applications.
    ai_context:
      instructions: Number of applications.
  - name: Approval Rate
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_IS_APPROVED") / NULLIF(SUM("v1_IS_DECIDED"), 0)
    description: Approved ÷ decided applications.
    ai_context:
      instructions: Approved ÷ decided applications.
  - name: Approved
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_IS_APPROVED")
    description: Approved applications.
    ai_context:
      instructions: Approved applications.
  - name: Approved Lending
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_APPROVED_AMOUNT")
    description: Total amount approved.
    ai_context:
      instructions: Total amount approved.
  - name: Avg Childcare
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_CHILDCARE")
    description: Average monthly childcare.
    ai_context:
      instructions: Average monthly childcare.
  - name: Avg Credit Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_CREDIT_SCORE")
    description: Average credit score.
    ai_context:
      instructions: Average credit score.
  - name: Avg Days to Decision
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_DAYS_TO_DECISION")
    description: Average days from application to final decision.
    ai_context:
      instructions: Average days from application to final decision.
  - name: Avg Discretionary Spend
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_DISCRETIONARY_SPEND")
    description: Average monthly discretionary spend.
    ai_context:
      instructions: Average monthly discretionary spend.
  - name: Avg Disposable After Loan
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_DISPOSABLE_AFTER_LOAN")
    description: Income minus essentials, existing debt and the new repayment.
    ai_context:
      instructions: Income minus essentials, existing debt and the new repayment.
  - name: Avg Essential Expenses
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_ESSENTIAL_EXPENSES")
    description: 'Average essential outgoings: housing, groceries, utilities & council tax, transport, childcare.'
    ai_context:
      instructions: 'Average essential outgoings: housing, groceries, utilities & council tax, transport, childcare.'
  - name: Avg Existing Debt
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_EXISTING_DEBT_PAYMENTS")
    description: Average existing monthly credit commitments.
    ai_context:
      instructions: Average existing monthly credit commitments.
  - name: Avg Groceries
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_GROCERIES")
    description: Average monthly groceries.
    ai_context:
      instructions: Average monthly groceries.
  - name: Avg Housing Cost
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_HOUSING_COST")
    description: Average rent or housing cost.
    ai_context:
      instructions: Average rent or housing cost.
  - name: Avg Monthly Income
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_MONTHLY_NET_INCOME")
    description: Average monthly net (take-home) income.
    ai_context:
      instructions: Average monthly net (take-home) income.
  - name: Avg Proposed Repayment
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_PROPOSED_REPAYMENT")
    description: Average monthly repayment on the new credit.
    ai_context:
      instructions: Average monthly repayment on the new credit.
  - name: Avg Requested Amount
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_REQUESTED_AMOUNT")
    description: Average amount requested.
    ai_context:
      instructions: Average amount requested.
  - name: Avg Total Expenses
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_TOTAL_EXPENSES")
    description: 'Average monthly outgoings: essential plus discretionary.'
    ai_context:
      instructions: 'Average monthly outgoings: essential plus discretionary.'
  - name: Avg Transport
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_TRANSPORT")
    description: Average monthly transport.
    ai_context:
      instructions: Average monthly transport.
  - name: Avg Utilities
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_UTILITIES_COUNCIL_TAX")
    description: Average utilities and council tax.
    ai_context:
      instructions: Average utilities and council tax.
  - name: Debt to Income
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: >-
            (CASE WHEN COALESCE(SUM("v1_EXISTING_DEBT_PAYMENTS"), SUM("v1_PROPOSED_REPAYMENT")) IS NULL THEN NULL ELSE
            COALESCE(SUM("v1_EXISTING_DEBT_PAYMENTS"), 0) + COALESCE(SUM("v1_PROPOSED_REPAYMENT"), 0) END) /
            NULLIF(SUM("v1_MONTHLY_NET_INCOME"), 0)
    description: Existing plus new repayments ÷ net income (portfolio-weighted).
    ai_context:
      instructions: Existing plus new repayments ÷ net income (portfolio-weighted).
  - name: Expense Ratio
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_TOTAL_EXPENSES") / NULLIF(SUM("v1_MONTHLY_NET_INCOME"), 0)
    description: Total expenses ÷ net income (portfolio-weighted).
    ai_context:
      instructions: Total expenses ÷ net income (portfolio-weighted).
  - name: Open Applications
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_IS_OPEN")
    description: Applications still in the workflow.
    ai_context:
      instructions: Applications still in the workflow.
  - name: Pass Rate
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_IS_PASS") / NULLIF(SUM("v1_APP_COUNT"), 0)
    description: Share of applications passing default affordability policy.
    ai_context:
      instructions: Share of applications passing default affordability policy.
  - name: Proposal Upheld Rate
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_PROPOSAL_UPHELD") / NULLIF(SUM("v1_IS_DECIDED"), 0)
    description: Decided applications where the approver confirmed the underwriter proposal.
    ai_context:
      instructions: Decided applications where the approver confirmed the underwriter proposal.
  - name: Requested Lending
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_REQUESTED_AMOUNT")
    description: Total amount requested.
    ai_context:
      instructions: Total amount requested.
