              expression: '"AGE"'
      - name: Stage
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STAGE"'
        dimension: {}
        description: 'Workflow stage: Affordability Check → Awaiting Approval → Decided.'
        ai_context:
          instructions: 'Workflow stage: Affordability Check → Awaiting Approval → Decided.'
      - name: Region
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"REGION"'
        dimension: {}
        description: UK region of the applicant.
        ai_context:
          instructions: UK region of the applicant.
      - name: Channel
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CHANNEL"'
        dimension: {}
        description: Where the application was made.
        ai_context:
          instructions: Where the application was made.
      - name: Is Open
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_OPEN"'
      - name: Is Pass
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_PASS"'
      - name: Outcome
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"OUTCOME"'
        dimension: {}
        description: Approved, Declined, Pending approval or In assessment.
        ai_context:
          instructions: Approved, Declined, Pending approval or In assessment.
      - name: Product
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PRODUCT"'
        dimension: {}
        description: Credit product applied for.
        ai_context:
          instructions: Credit product applied for.
      - name: Age Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AGE_BAND"'
        dimension: {}
        description: Applicant age band.
        ai_context:
          instructions: Applicant age band.
      - name: Approver
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPROVER"'
        dimension: {}
        description: Credit approver who signs off the decision.
        ai_context:
          instructions: Credit approver who signs off the decision.
      - name: Proposal
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PROPOSAL"'
        dimension: {}
        description: 'Underwriter''s proposal: Approve, Counter-offer, Refer or Decline.'
        ai_context:
          instructions: 'Underwriter''s proposal: Approve, Counter-offer, Refer or Decline.'
      - name: App Count
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APP_COUNT"'
      - name: Childcare
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CHILDCARE"'
      - name: Days Open
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAYS_OPEN"'
      - name: Groceries
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"GROCERIES"'
      - name: Transport
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TRANSPORT"'
      - name: Is Decided
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_DECIDED"'
      - name: Credit Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CREDIT_BAND"'
        dimension: {}
        description: Credit score band (Experian-style 0–999).
        ai_context:
          instructions: Credit score band (Experian-style 0–999).
      - name: Income Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"INCOME_BAND"'
        dimension: {}
        description: Monthly net income band (sort prefix 1–5).
        ai_context:
          instructions: Monthly net income band (sort prefix 1–5).
      - name: Is Approved
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_APPROVED"'
      - name: Stage Order
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STAGE_ORDER"'
      - name: Term Months
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TERM_MONTHS"'
      - name: Underwriter
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"UNDERWRITER"'
        dimension: {}
        description: Underwriter who drafted the proposal.
        ai_context:
          instructions: Underwriter who drafted the proposal.
      - name: Applicant Id
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPLICANT_ID"'
      - name: Credit Score
        expression:
