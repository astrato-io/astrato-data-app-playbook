      - name: Debt To Income
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DEBT_TO_INCOME"'
      - name: Final Decision
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FINAL_DECISION"'
      - name: Household Size
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOUSEHOLD_SIZE"'
      - name: Loan To Income
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LOAN_TO_INCOME"'
      - name: Total Expenses
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TOTAL_EXPENSES"'
      - name: Approved Amount
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"APPROVED_AMOUNT"'
      - name: Employment Type
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EMPLOYMENT_TYPE"'
        dimension: {}
