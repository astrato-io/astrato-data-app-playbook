                        "name": "create_po",
                        "sql": "INSERT INTO ASTRATO_GALLERY.ASTRATO.CORVO_INV_PURCHASE_ORDERS (\"po_id\",\"sku\",\"supplier_id\",\"warehouse_id\",\"order_date\",\"expected_date\",\"received_date\",\"qty_ordered\",\"qty_received\",\"status\") SELECT 'PO-'||LEFT(UUID_STRING(),8),p.\"sku\",p.\"supplier_id\",{warehouse_id:string},CURRENT_DATE,DATEADD(day,s.\"lead_time_days\",CURRENT_DATE),NULL,{qty:int},0,'Open' FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_PRODUCTS p JOIN ASTRATO_GALLERY.ASTRATO.CORVO_INV_SUPPLIERS s ON s.\"supplier_id\"=p.\"supplier_id\" WHERE p.\"sku\"={sku:string}"
