version: 0.1.1
name: Corvo – Inventory Rotation (illustrative synthetic data)
datasets:
  - name: Batch Rotation
    source: >-
      WITH d AS (SELECT "sku", "warehouse_id", SUM("qty_shipped")/28.0 AS daily FROM
      ASTRATO_GALLERY.ASTRATO.CORVO_INV_SALES_ORDERS WHERE "order_date" >= DATEADD(day,-28,CURRENT_DATE) GROUP BY 1,2), b AS
      (SELECT x.*, DATEDIFF(day,CURRENT_DATE,x."expiry_date") AS dte, COALESCE(d.daily,0) AS daily,
      COALESCE(SUM(x."qty_on_hand") OVER (PARTITION BY x."sku",x."warehouse_id" ORDER BY x."expiry_date",x."batch_id"
      ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING),0) AS ahead FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES x LEFT
      JOIN d ON d."sku"=x."sku" AND d."warehouse_id"=x."warehouse_id" WHERE x."qty_on_hand">0) SELECT b."batch_id" AS
      batch_id, b."sku" AS sku, p."product_name" AS product_name, p."category" AS category, b."warehouse_id" AS
      warehouse_id, b."status" AS status, b."received_date" AS received_date, b."expiry_date" AS expiry_date, b.dte AS
      days_to_expiry, CASE WHEN b.dte<=30 THEN '0-30 days' WHEN b.dte<=60 THEN '31-60 days' WHEN b.dte<=90 THEN '61-90
      days' WHEN b.dte<=180 THEN '91-180 days' ELSE '180+ days' END AS expiry_band, b."qty_on_hand" AS qty_on_hand,
      b."qty_on_hand"*b."unit_cost_gbp" AS stock_value_gbp, ROUND(b.daily,1) AS daily_run_rate,
      ROUND(b."qty_on_hand"-GREATEST(0,LEAST(b."qty_on_hand",b.daily*b.dte-b.ahead))) AS qty_at_risk,
      ROUND((b."qty_on_hand"-GREATEST(0,LEAST(b."qty_on_hand",b.daily*b.dte-b.ahead)))*b."unit_cost_gbp",2) AS
      value_at_risk_gbp FROM b JOIN ASTRATO_GALLERY.ASTRATO.CORVO_INV_PRODUCTS p ON p."sku"=b."sku"
    description: >-
      One row per live batch, with days to expiry and FEFO-projected quantity at risk of expiring unsold, using the last
      28 days of shipments as the run rate.
    fields:
      - name: SKU
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SKU"'
      - name: STATUS
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STATUS"'
      - name: BATCH_ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BATCH_ID"'
      - name: CATEGORY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
      - name: EXPIRY_BAND
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPIRY_BAND"'
      - name: EXPIRY_DATE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPIRY_DATE"'
      - name: QTY_AT_RISK
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QTY_AT_RISK"'
      - name: QTY_ON_HAND
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QTY_ON_HAND"'
      - name: PRODUCT_NAME
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PRODUCT_NAME"'
      - name: WAREHOUSE_ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WAREHOUSE_ID"'
      - name: RECEIVED_DATE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"RECEIVED_DATE"'
      - name: DAILY_RUN_RATE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAILY_RUN_RATE"'
      - name: DAYS_TO_EXPIRY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAYS_TO_EXPIRY"'
      - name: STOCK_VALUE_GBP
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOCK_VALUE_GBP"'
      - name: VALUE_AT_RISK_GBP
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE_AT_RISK_GBP"'
      - name: Batch
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BATCH_ID"'
        dimension: {}
        description: Live batch.
        ai_context:
          instructions: Live batch.
      - name: Batch Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STATUS"'
        dimension: {}
        description: Available or Quarantine.
        ai_context:
          instructions: Available or Quarantine.
      - name: Expiry Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPIRY_BAND"'
        dimension: {}
        description: Days-to-expiry band.
        ai_context:
          instructions: Days-to-expiry band.
      - name: Expiry Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPIRY_DATE"'
        dimension:
          is_time: true
        description: Batch expiry date.
        ai_context:
          instructions: Batch expiry date.
  - name: Stock Position
    source: >-
      WITH k AS (SELECT p."sku", p."product_name", p."category", p."supplier_id", p."reorder_cover_days",
      w."warehouse_id" FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_PRODUCTS p CROSS JOIN ASTRATO_GALLERY.ASTRATO.CORVO_INV_WAREHOUSES
      w), s AS (SELECT "sku","warehouse_id",SUM(IFF("status"='Available',"qty_on_hand",0)) AS avail,
      SUM(IFF("status"='Quarantine',"qty_on_hand",0)) AS quar FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES GROUP BY 1,2), d
      AS (SELECT "sku","warehouse_id",SUM("qty_shipped")/28.0 AS daily FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_SALES_ORDERS
      WHERE "order_date">=DATEADD(day,-28,CURRENT_DATE) GROUP BY 1,2), o AS (SELECT
      "sku","warehouse_id",SUM("qty_ordered") AS inbound, MIN("expected_date") AS next_due FROM
      ASTRATO_GALLERY.ASTRATO.CORVO_INV_PURCHASE_ORDERS WHERE "status" IN ('Open','Delayed') GROUP BY 1,2), c AS (SELECT k.*,
      COALESCE(s.avail,0) avail, COALESCE(s.quar,0) quar, COALESCE(d.daily,0) daily, COALESCE(o.inbound,0) inbound,
      o.next_due FROM k LEFT JOIN s ON s."sku"=k."sku" AND s."warehouse_id"=k."warehouse_id" LEFT JOIN d ON
      d."sku"=k."sku" AND d."warehouse_id"=k."warehouse_id" LEFT JOIN o ON o."sku"=k."sku" AND
      o."warehouse_id"=k."warehouse_id") SELECT "sku" AS sku, "product_name" AS product_name, "category" AS category,
      "supplier_id" AS supplier_id, "warehouse_id" AS warehouse_id, avail AS qty_available, quar AS qty_quarantine,
      ROUND(daily,1) AS daily_run_rate, ROUND(avail/NULLIF(daily,0),1) AS days_of_cover, "reorder_cover_days" AS
      reorder_cover_days, inbound AS qty_inbound, next_due AS next_po_due, CASE WHEN avail<daily*7 THEN 'Stockout risk'
      WHEN avail+inbound<daily*"reorder_cover_days" THEN 'Reorder now' WHEN avail>daily*120 THEN 'Overstocked' ELSE
      'Healthy' END AS stock_status, GREATEST(0,CEIL(daily*("reorder_cover_days"+30)-avail-inbound)) AS
      suggested_order_qty FROM c
    description: >-
      One row per SKU and warehouse: available stock, run rate, days of cover, inbound purchase orders, reorder status
      and suggested order quantity.
    fields:
      - name: SKU
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SKU"'
      - name: CATEGORY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
      - name: NEXT_PO_DUE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"NEXT_PO_DUE"'
      - name: QTY_INBOUND
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QTY_INBOUND"'
      - name: SUPPLIER_ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SUPPLIER_ID"'
      - name: PRODUCT_NAME
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PRODUCT_NAME"'
      - name: STOCK_STATUS
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOCK_STATUS"'
      - name: WAREHOUSE_ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WAREHOUSE_ID"'
      - name: DAYS_OF_COVER
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAYS_OF_COVER"'
      - name: QTY_AVAILABLE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QTY_AVAILABLE"'
      - name: DAILY_RUN_RATE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAILY_RUN_RATE"'
      - name: QTY_QUARANTINE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QTY_QUARANTINE"'
      - name: REORDER_COVER_DAYS
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"REORDER_COVER_DAYS"'
      - name: SUGGESTED_ORDER_QTY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SUGGESTED_ORDER_QTY"'
      - name: Stock Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOCK_STATUS"'
        dimension: {}
        description: Stockout risk, Reorder now, Healthy, Overstocked.
        ai_context:
          instructions: Stockout risk, Reorder now, Healthy, Overstocked.
