            "Receive Purchase Order": {
              "description": "Goods in: creates a new batch from an open or delayed PO, logs the Receipt movement and closes the PO.",
              "implementation": {
                "dialects": {
                  "snowflake": {
                    "result": {
                      "field": "rows_affected",
                      "mode": "affectedRows",
                      "statement": "close_po"
                    },
                    "statements": [
                      {
                        "name": "create_batch",
                        "sql": "INSERT INTO ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES (\"batch_id\",\"sku\",\"warehouse_id\",\"supplier_id\",\"received_date\",\"expiry_date\",\"qty_received\",\"qty_on_hand\",\"unit_cost_gbp\",\"status\") SELECT 'B-'||o.\"po_id\",o.\"sku\",o.\"warehouse_id\",o.\"supplier_id\",CURRENT_DATE,{expiry_date:date},{qty_received:int},{qty_received:int},p.\"unit_cost_gbp\",'Available' FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_PURCHASE_ORDERS o JOIN ASTRATO_GALLERY.ASTRATO.CORVO_INV_PRODUCTS p ON p.\"sku\"=o.\"sku\" WHERE o.\"po_id\"={po_id:string} AND o.\"status\" IN ('Open','Delayed')"
                      },
                      {
                        "name": "log_movement",
                        "sql": "INSERT INTO ASTRATO_GALLERY.ASTRATO.CORVO_INV_MOVEMENTS (\"movement_id\",\"movement_date\",\"batch_id\",\"sku\",\"warehouse_id\",\"movement_type\",\"qty\",\"reference\",\"created_by\") SELECT 'MV-'||UUID_STRING(),CURRENT_DATE,'B-'||\"po_id\",\"sku\",\"warehouse_id\",'Receipt',{qty_received:int},\"po_id\",'workflow' FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_PURCHASE_ORDERS WHERE \"po_id\"={po_id:string} AND \"status\" IN ('Open','Delayed')"
                      },
                      {
                        "name": "close_po",
                        "sql": "UPDATE ASTRATO_GALLERY.ASTRATO.CORVO_INV_PURCHASE_ORDERS SET \"status\"='Received',\"received_date\"=CURRENT_DATE,\"qty_received\"={qty_received:int} WHERE \"po_id\"={po_id:string} AND \"status\" IN ('Open','Delayed')"
                      }
                    ]
                  }
                },
                "transaction": true
