                        "name": "set_qty",
                        "sql": "UPDATE ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES SET \"qty_on_hand\"={counted:int} WHERE \"batch_id\"={batch_id:string}"
                      }
