            "Record Dispatch": {
              "description": "Goods out: ships units from a named batch. Refused unless the batch is Available and holds enough stock.",
              "implementation": {
                "dialects": {
                  "snowflake": {
                    "result": {
                      "field": "rows_affected",
                      "mode": "affectedRows",
                      "statement": "decrement"
