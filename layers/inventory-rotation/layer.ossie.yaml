                        "sql": "INSERT INTO ASTRATO_GALLERY.ASTRATO.CORVO_INV_MOVEMENTS (\"movement_id\",\"movement_date\",\"batch_id\",\"sku\",\"warehouse_id\",\"movement_type\",\"qty\",\"reference\",\"created_by\") SELECT 'MV-'||UUID_STRING(),CURRENT_DATE,\"batch_id\",\"sku\",\"warehouse_id\",'Customer Shipment',-{qty:int},{reference:string},'workflow' FROM ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES WHERE \"batch_id\"={batch_id:string} AND \"status\"='Available' AND \"qty_on_hand\">={qty:int}"
                      },
