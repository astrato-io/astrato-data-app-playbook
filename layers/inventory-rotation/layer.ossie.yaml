                        "name": "decrement",
                        "sql": "UPDATE ASTRATO_GALLERY.ASTRATO.CORVO_INV_BATCHES SET \"qty_on_hand\"=\"qty_on_hand\"-{qty:int} WHERE \"batch_id\"={batch_id:string} AND \"status\"='Available' AND \"qty_on_hand\">={qty:int}"
