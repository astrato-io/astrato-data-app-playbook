    ai_context:
      instructions: Number of journey events (contracts, QBRs, incidents, stakeholder changes).
  - name: Account Gross Margin %
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: >-
            (CASE WHEN COALESCE(SUM("v4_CURRENT_ARR"), SUM("v4_ANNUAL_CLOUD_COST"), SUM("v4_ANNUAL_SUPPORT_COST")) IS
            NULL THEN NULL ELSE COALESCE(SUM("v4_CURRENT_ARR"), 0) - COALESCE(SUM("v4_ANNUAL_CLOUD_COST"), 0) -
            COALESCE(SUM("v4_ANNUAL_SUPPORT_COST"), 0) END) / NULLIF(SUM("v4_CURRENT_ARR"), 0)
    description: Account gross profit / ARR (ratio of sums).
    ai_context:
      instructions: Account gross profit / ARR (ratio of sums).
  - name: Account Gross Profit
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: >-
            CASE WHEN COALESCE(SUM("v4_CURRENT_ARR"), SUM("v4_ANNUAL_CLOUD_COST"), SUM("v4_ANNUAL_SUPPORT_COST")) IS
            NULL THEN NULL ELSE COALESCE(SUM("v4_CURRENT_ARR"), 0) - COALESCE(SUM("v4_ANNUAL_CLOUD_COST"), 0) -
            COALESCE(SUM("v4_ANNUAL_SUPPORT_COST"), 0) END
