            "compiledSql": "WITH pd1 AS ( -- PERIOD AXIS 2026-01-01 TO 2026-09-30; COMPARISON 2025-01-01 TO 2025-09-30\n  SELECT\n    DATEADD('DAY', s, DATE '2025-01-01') AS \"period_date\",\n    CAST(NULL AS DATE) AS \"cmp_date\"\n  FROM (\n    SELECT\n      ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1 AS s\n    FROM TABLE(GENERATOR(ROWCOUNT => 273))\n  ) AS u1\n  UNION ALL\n  SELECT\n    DATEADD('DAY', s, DATE '2026-01-01') AS \"period_date\",\n    CASE WHEN s < 273 THEN DATEADD('YEAR', -1, DATEADD('DAY', s, DATE '2026-01-01')) ELSE NULL END AS \"cmp_date\"\n  FROM (\n    SELECT\n      ROW_NUMBER() OVER (ORDER BY SEQ4()) - 1 AS s\n    FROM TABLE(GENERATOR(ROWCOUNT => 273))\n  ) AS u1\n),\nq1 AS (\n  SELECT\n    d1,\n    SUM(\n      CASE WHEN -- FILTER\n        \"v18_SCENARIO\" = 'Actual'\n      THEN \"v18_SIGNED_USD\"\n      ELSE 0\n      END\n    ) AS m1\n  FROM (\n    SELECT\n      DATE_TRUNC('YEAR',d1) AS d1,\n      \"v18_SIGNED_USD\", \"v18_SCENARIO\"\n    FROM (\n      SELECT -- GRAIN Synthetical - P&L\n        DATE_TRUNC('DAY',pd1.\"period_date\") AS d1,\n        v18.SIGNED_USD AS \"v18_SIGNED_USD\",\n        v18.SCENARIO AS \"v18_SCENARIO\"\n      FROM pd1\n      LEFT JOIN ASTRATO_GALLERY.MOCK_DATA.NB_PNL AS v18 ON pd1.\"period_date\" = DATE_TRUNC('DAY',v18.MONTH)\n    ) AS u1\n    WHERE (u1.d1 >= TO_DATE('2026-01-01','YYYY-MM-DD') AND u1.d1 <= TO_DATE('2026-09-30','YYYY-MM-DD') OR u1.d1 >= TO_DATE('2025-01-01','YYYY-MM-DD') AND u1.d1 <= TO_DATE('2025-09-30','YYYY-MM-DD'))\n  ) AS u1\n  GROUP BY d1\n)\nSELECT\n  q1.d1 AS d1,\n  q1c.m1 AS m1 -- PERIOD ON PERIOD\nFROM q1\nLEFT JOIN pd1 ON q1.d1 = pd1.\"period_date\"\nLEFT JOIN q1 AS q1c ON q1c.d1 = pd1.\"cmp_date\"\nWHERE q1.d1 >= TO_DATE('2026-01-01','YYYY-MM-DD') AND q1.d1 <= TO_DATE('2026-09-30','YYYY-MM-DD')\nLIMIT 200\n;",
