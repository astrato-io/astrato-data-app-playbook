                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIM_EVENTS SELECT 'CEV-' || UUID_STRING(), c.\"CLAIM_ID\", '', 'Claim confirmed & submitted', '', c.\"STATUS\", {acting_as:string}, (SELECT MAX(\"ROLE\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS WHERE \"USER_NAME\" = {acting_as:string}), COALESCE(c.\"CONFIRMED_AMOUNT\", c.\"ESTIMATE_AT_DISCOVERY\"), c.\"CURRENCY\", {payer_ref:string}, LEFT('Follow up ' || {next_follow_up:string}, 1900), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, CURRENT_DATE(), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c WHERE c.\"CLAIM_ID\" = {claim_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Claims Owner'))"
