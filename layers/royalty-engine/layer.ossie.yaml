            "Record Recovery": {
              "description": "Finance records a partial or full recovery against a receipt or adjustment. Evidence is required for it to count; a reference can be allocated only once. Demo writeback target.",
              "implementation": {
                "dialects": {
                  "snowflake": {
                    "result": {
                      "field": "rows_affected",
                      "mode": "affectedRows",
                      "statement": "record"
                    },
                    "statements": [
                      {
                        "name": "record",
                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_RECOVERIES SELECT {recovery_id:string}, c.\"CLAIM_ID\", {amount:float}, c.\"CURRENCY\", r.\"REF_TYPE\", r.\"RECEIPT_REF\", {evidence:string}, IFF(LENGTH(TRIM({evidence:string})) > 0, 'Y', 'N'), IFF(LENGTH(TRIM({evidence:string})) > 0, {acting_as:string}, ''), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, {acting_as:string}, CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, IFF(LENGTH(TRIM({evidence:string})) > 0, 1, 0), IFF(LENGTH(TRIM({evidence:string})) > 0, {amount:float}, 0), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c JOIN ASTRATO_GALLERY.MOCK_DATA.ROYALTY_RECEIPTS r ON r.\"RECEIPT_REF\" = {supporting_ref:string} AND r.\"CURRENCY\" = c.\"CURRENCY\" WHERE c.\"CLAIM_ID\" = {claim_id:string} AND c.\"STATUS\" IN ('Submitted', 'Partially recovered') AND NOT EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_RECOVERIES x WHERE x.\"SUPPORTING_REF\" = {supporting_ref:string}) AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance (Recovery)'))"
                      },
                      {
                        "name": "status",
                        "sql": "UPDATE ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c SET \"STATUS\" = IFF((SELECT SUM(\"VERIFIED_AMOUNT\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_RECOVERIES WHERE \"CLAIM_ID\" = c.\"CLAIM_ID\") >= c.\"CONFIRMED_AMOUNT\", 'Recovered', 'Partially recovered'), \"UPDATED_BY\" = {acting_as:string}, \"UPDATED_AT\" = CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ WHERE c.\"CLAIM_ID\" = {claim_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance (Recovery)'))"
                      },
                      {
                        "name": "audit",
                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIM_EVENTS SELECT 'CEV-' || UUID_STRING(), c.\"CLAIM_ID\", '', 'Recovery recorded', '', c.\"STATUS\", {acting_as:string}, (SELECT MAX(\"ROLE\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS WHERE \"USER_NAME\" = {acting_as:string}), {amount:float}, c.\"CURRENCY\", {supporting_ref:string}, LEFT('Evidence: ' || {evidence:string}, 1900), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, CURRENT_DATE(), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c WHERE c.\"CLAIM_ID\" = {claim_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance (Recovery)'))"
                      }
                    ]
                  }
                },
                "transaction": true
              },
              "kind": "virtualProcedure",
              "parameters": [
                {
                  "dataType": "string",
                  "description": "New recovery ID.",
                  "name": "recovery_id"
                },
                {
                  "dataType": "string",
