            "Controller Decide Case": {
              "description": "Finance Controller approves the disposition, returns it for more work, or approves a carry-forward (rationale required). Maker–checker: never on a case they submitted. Carry-forwards remain in outstanding source exposure. Demo writeback target.",
              "implementation": {
                "dialects": {
                  "snowflake": {
                    "result": {
                      "field": "rows_affected",
                      "mode": "affectedRows",
                      "statement": "decide"
                    },
                    "statements": [
                      {
                        "name": "decide",
                        "sql": "UPDATE ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES SET \"STATUS\" = {decision:string}, \"CONTROLLER\" = {acting_as:string}, \"CONTROLLER_RATIONALE\" = NULLIF({rationale:string}, ''), \"CARRY_FORWARD\" = IFF({decision:string} = 'Carry-forward approved', 'Y', 'N'), \"IS_OPEN\" = IFF({decision:string} = 'Returned', 1, 0), \"IS_OVERDUE\" = IFF({decision:string} = 'Returned', \"IS_OVERDUE\", 0), \"UPDATED_BY\" = {acting_as:string}, \"UPDATED_AT\" = CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ WHERE \"CASE_ID\" = {case_id:string} AND \"STATUS\" = 'Submitted for review' AND {decision:string} IN ('Approved', 'Returned', 'Carry-forward approved') AND ({decision:string} = 'Approved' OR LENGTH(TRIM({rationale:string})) > 0) AND \"UPDATED_BY\" <> {acting_as:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance Controller') AND (u.\"BRANCH_SCOPE\" = 'ALL' OR CONTAINS(u.\"BRANCH_SCOPE\", (SELECT s.\"BRANCH\" FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c JOIN ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS s USING (\"STATEMENT_ID\") WHERE c.\"CASE_ID\" = {case_id:string}))))"
                      },
                      {
                        "name": "audit",
                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_EVENTS SELECT 'EV-' || UUID_STRING(), c.\"CASE_ID\", c.\"STATEMENT_ID\", 'Controller: ' || {decision:string}, '', {decision:string}, {acting_as:string}, (SELECT MAX(\"ROLE\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS WHERE \"USER_NAME\" = {acting_as:string}), c.\"OBSERVED_AMOUNT\", c.\"OBSERVED_CURRENCY\", LEFT(COALESCE(NULLIF({rationale:string}, ''), 'Disposition approved'), 1900), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, CURRENT_DATE(), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c WHERE c.\"CASE_ID\" = {case_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance Controller') AND (u.\"BRANCH_SCOPE\" = 'ALL' OR CONTAINS(u.\"BRANCH_SCOPE\", (SELECT s.\"BRANCH\" FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c JOIN ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS s USING (\"STATEMENT_ID\") WHERE c.\"CASE_ID\" = {case_id:string}))))"
                      }
                    ]
                  }
                },
                "transaction": true
              },
              "kind": "virtualProcedure",
              "parameters": [
                {
                  "dataType": "string",
                  "description": "Case ID.",
                  "name": "case_id"
                },
                {
                  "dataType": "string",
                  "description": "Approved, Returned or Carry-forward approved.",
                  "name": "decision"
                },
                {
                  "dataType": "string",
                  "default": "",
                  "description": "Required for Returned and Carry-forward approved.",
                  "name": "rationale"
                },
                {
                  "dataType": "string",
                  "description": "Person acting (must exist in ROYALTY_USERS with the right role and branch).",
                  "name": "acting_as"
                }
              ],
              "returns": {
                "fields": {
                  "rows_affected": {
                    "dataType": "int"
                  }
                }
              }
            },
