                      {
                        "name": "submit",
                        "sql": "UPDATE ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES SET \"STATUS\" = 'Submitted for review', \"NOTES\" = {notes:string}, \"EVIDENCE_REFS\" = {evidence_refs:string}, \"DISPOSITION\" = {disposition:string}, \"UPDATED_BY\" = {acting_as:string}, \"UPDATED_AT\" = CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ WHERE \"CASE_ID\" = {case_id:string} AND \"STATUS\" IN ('Assigned', 'Returned', 'Open') AND LENGTH(TRIM({evidence_refs:string})) > 0 AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Royalty Analyst') AND (u.\"BRANCH_SCOPE\" = 'ALL' OR CONTAINS(u.\"BRANCH_SCOPE\", (SELECT s.\"BRANCH\" FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c JOIN ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS s USING (\"STATEMENT_ID\") WHERE c.\"CASE_ID\" = {case_id:string}))))"
                      },
                      {
                        "name": "audit",
                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_EVENTS SELECT 'EV-' || UUID_STRING(), c.\"CASE_ID\", c.\"STATEMENT_ID\", 'Submitted for review', '', 'Submitted for review', {acting_as:string}, (SELECT MAX(\"ROLE\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS WHERE \"USER_NAME\" = {acting_as:string}), c.\"OBSERVED_AMOUNT\", c.\"OBSERVED_CURRENCY\", LEFT({disposition:string} || ' · evidence: ' || {evidence_refs:string}, 1900), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, CURRENT_DATE(), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c WHERE c.\"CASE_ID\" = {case_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Royalty Analyst') AND (u.\"BRANCH_SCOPE\" = 'ALL' OR CONTAINS(u.\"BRANCH_SCOPE\", (SELECT s.\"BRANCH\" FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES c JOIN ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS s USING (\"STATEMENT_ID\") WHERE c.\"CASE_ID\" = {case_id:string}))))"
                      }
                    ]
