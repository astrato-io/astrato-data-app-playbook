                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES SELECT {case_id:string}, s.\"STATEMENT_ID\", {exception_type:string}, 'Assigned', {owner:string}, TO_DATE({due_date:string}), s.\"SOURCE_EXPOSURE\", s.\"CURRENCY\", s.\"IS_RECONCILED\", NULLIF({notes:string}, ''), '', '', '', '', 'N', IFF(TO_DATE({due_date:string}) < '2026-11-11', 1, 0), 1, {acting_as:string}, CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, {acting_as:string}, CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS s WHERE s.\"STATEMENT_ID\" = {statement_id:string} AND NOT EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLOSE_CASES x WHERE x.\"STATEMENT_ID\" = s.\"STATEMENT_ID\" AND x.\"IS_OPEN\" = 1) AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Royalty Analyst') AND (u.\"BRANCH_SCOPE\" = 'ALL' OR CONTAINS(u.\"BRANCH_SCOPE\", (SELECT \"BRANCH\" FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_STATEMENTS WHERE \"STATEMENT_ID\" = {statement_id:string}))))"
