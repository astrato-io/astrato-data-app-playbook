          "dataActions": {
            "Close Recovery Claim": {
              "description": "Closes a claim; the unrecovered remainder is waived or otherwise resolved with a closure reason. Demo writeback target.",
              "implementation": {
                "dialects": {
                  "snowflake": {
                    "result": {
                      "field": "rows_affected",
                      "mode": "affectedRows",
                      "statement": "close"
                    },
                    "statements": [
                      {
                        "name": "close",
                        "sql": "UPDATE ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c SET \"STATUS\" = 'Closed', \"CLOSURE_REASON\" = {closure_reason:string}, \"WAIVED_AMOUNT\" = GREATEST(0, c.\"CONFIRMED_AMOUNT\" - COALESCE((SELECT SUM(\"VERIFIED_AMOUNT\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_RECOVERIES WHERE \"CLAIM_ID\" = c.\"CLAIM_ID\"), 0)), \"IS_OPEN\" = 0, \"UPDATED_BY\" = {acting_as:string}, \"UPDATED_AT\" = CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ WHERE c.\"CLAIM_ID\" = {claim_id:string} AND LENGTH(TRIM({closure_reason:string})) > 0 AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance (Recovery)', 'Claims Owner'))"
                      },
                      {
                        "name": "audit",
                        "sql": "INSERT INTO ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIM_EVENTS SELECT 'CEV-' || UUID_STRING(), c.\"CLAIM_ID\", '', 'Claim closed', '', c.\"STATUS\", {acting_as:string}, (SELECT MAX(\"ROLE\") FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS WHERE \"USER_NAME\" = {acting_as:string}), COALESCE(c.\"CONFIRMED_AMOUNT\", c.\"ESTIMATE_AT_DISCOVERY\"), c.\"CURRENCY\", '', LEFT({closure_reason:string}, 1900), CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ, CURRENT_DATE(), 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS c WHERE c.\"CLAIM_ID\" = {claim_id:string} AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Finance (Recovery)', 'Claims Owner'))"
                      }
                    ]
                  }
                },
                "transaction": true
              },
              "kind": "virtualProcedure",
              "parameters": [
                {
                  "dataType": "string",
                  "description": "Claim ID.",
                  "name": "claim_id"
                },
                {
                  "dataType": "string",
                  "description": "Required.",
                  "name": "closure_reason"
                },
                {
                  "dataType": "string",
                  "description": "Person acting (must exist in ROYALTY_USERS with the right role and branch).",
                  "name": "acting_as"
                }
              ],
              "returns": {
                "fields": {
                  "rows_affected": {
                    "dataType": "int"
                  }
                }
              }
            },
            "Confirm Recovery Claim": {
              "description": "Claims owner records the confirmed claim amount, submission date, payer reference and next follow-up. Demo writeback target.",
              "implementation": {
                "dialects": {
                  "snowflake": {
