                        "sql": "UPDATE ASTRATO_GALLERY.MOCK_DATA.ROYALTY_CLAIMS SET \"STATUS\" = 'Submitted', \"CONFIRMED_AMOUNT\" = {confirmed_amount:float}, \"SUBMISSION_DATE\" = TO_DATE({submission_date:string}), \"PAYER_REF\" = {payer_ref:string}, \"NEXT_FOLLOW_UP\" = TO_DATE({next_follow_up:string}), \"UPDATED_BY\" = {acting_as:string}, \"UPDATED_AT\" = CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ WHERE \"CLAIM_ID\" = {claim_id:string} AND \"STATUS\" IN ('Open', 'Confirmed') AND {confirmed_amount:float} > 0 AND EXISTS (SELECT 1 FROM ASTRATO_GALLERY.MOCK_DATA.ROYALTY_USERS u WHERE u.\"USER_NAME\" = {acting_as:string} AND u.\"CAN_WRITE\" = 'Y' AND u.\"ROLE\" IN ('Claims Owner'))"
