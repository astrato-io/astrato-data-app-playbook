version: 0.1.1
name: UK Labour Market (ONS LMS)
datasets:
  - name: Labour Market
    source: '"MOCK_DATA"."LMS_FACT"'
    description: >-
      ONS Labour Market Statistics (LMS), release 15 Sep 2026. One row per series per month (Jan 2015 onward), with the
      value 3 months earlier, 12 months earlier and in Feb 2020 (pre-pandemic, Dec-Feb 2020 for LFS). LFS series are
      rolling 3-month averages labelled by their final month. Each series (CDID) has its own unit: never add values
      across indicators.
    fields:
      - name: Sex
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SEX"'
        dimension: {}
        description: All, Male or Female
        ai_context:
          instructions: All, Male or Female
      - name: Cdid
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CDID"'
      - name: Unit
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"UNIT"'
        dimension: {}
        description: Unit of the series
        ai_context:
          instructions: Unit of the series
      - name: Theme
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"THEME"'
        dimension: {}
        description: Employment, Unemployment, Inactivity, Pay, Vacancies, Regional
        ai_context:
          instructions: Employment, Unemployment, Inactivity, Pay, Vacancies, Regional
      - name: Value
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE"'
      - name: Method
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"METHOD"'
      - name: Geography
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"GEOGRAPHY"'
        dimension: {}
        description: United Kingdom or region/nation
        ai_context:
          instructions: United Kingdom or region/nation
      - name: Indicator
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"INDICATOR"'
        dimension: {}
        description: Short indicator name
        ai_context:
          instructions: Short indicator name
      - name: Ons Title
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ONS_TITLE"'
      - name: Period Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_DATE"'
      - name: Period Year
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_YEAR"'
      - name: Period Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_LABEL"'
        dimension: {}
        description: e.g. Apr-Jun 2026 for LFS rolling quarters
        ai_context:
          instructions: e.g. Apr-Jun 2026 for LFS rolling quarters
      - name: Period Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_STATUS"'
        dimension: {}
        description: Latest or History, per series
        ai_context:
          instructions: Latest or History, per series
      - name: Value Prev Year
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE_PREV_YEAR"'
      - name: Value Pre Pandemic
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE_PRE_PANDEMIC"'
      - name: Value Prev Quarter
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE_PREV_QUARTER"'
      - name: Months Before Latest
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"MONTHS_BEFORE_LATEST"'
      - name: Period
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_DATE"'
        dimension:
          is_time: true
        description: First day of the final month of the period
        ai_context:
          instructions: First day of the final month of the period
      - name: Series ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CDID"'
        dimension: {}
        description: ONS four-character series identifier (CDID)
        ai_context:
          instructions: ONS four-character series identifier (CDID)
      - name: Year
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PERIOD_YEAR"'
        dimension: {}
        description: Calendar year of the period end
        ai_context:
          instructions: Calendar year of the period end
metrics:
  - name: Change on Quarter
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: >-
            CASE WHEN COALESCE(AVG("v1_VALUE"), AVG("v1_VALUE_PREV_QUARTER")) IS NULL THEN NULL ELSE
            COALESCE(AVG("v1_VALUE"), 0) - COALESCE(AVG("v1_VALUE_PREV_QUARTER"), 0) END
    description: Value minus the value 3 months earlier, in the series' own unit (percentage points for rates).
    ai_context:
      instructions: Value minus the value 3 months earlier, in the series' own unit (percentage points for rates).
