version: 0.1.1
name: Thessaloniki on the Move
datasets:
  - name: Categories
    source: SELECT DISTINCT CATEGORY AS CATEGORY_KEY FROM ASTRATO_GALLERY.MOCK_DATA.TH_LINES
    description: 'Conformed line-category dimension (5 rows): joins Lines and Fleet so one category filter reaches both.'
    fields:
      - name: CATEGORY_KEY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY_KEY"'
  - name: Fleet
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."TH_FLEET_MINUTE"'
    fields:
      - name: Sim Day
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SIM_DAY"'
      - name: Category
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
      - name: Clock Hour
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CLOCK_HOUR"'
        dimension: {}
        description: Hour of the day, reference weekday.
        ai_context:
          instructions: Hour of the day, reference weekday.
      - name: Clock Time
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CLOCK_TIME"'
      - name: Buses Active
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BUSES_ACTIVE"'
      - name: Ten Min Slot
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TEN_MIN_SLOT"'
      - name: Two Min Slot
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TWO_MIN_SLOT"'
      - name: Five Min Slot
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FIVE_MIN_SLOT"'
      - name: Minute Of Day
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"MINUTE_OF_DAY"'
      - name: Trips Departing
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TRIPS_DEPARTING"'
      - name: Fifteen Min Slot
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FIFTEEN_MIN_SLOT"'
      - name: Fleet Category
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
        dimension: {}
        description: Line category of the buses in service.
        ai_context:
          instructions: Line category of the buses in service.
      - name: Ten-Minute Slot
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TEN_MIN_SLOT"'
        dimension: {}
        description: Clock time rounded down to 10 minutes, reference weekday.
        ai_context:
          instructions: Clock time rounded down to 10 minutes, reference weekday.
  - name: Hours
    source: >-
      SELECT LPAD(SEQ4()::STRING, 2, '0') || ':00' AS HOUR_KEY, CASE WHEN SEQ4() < 6 THEN '1. Night (0–6)' WHEN SEQ4() <
      10 THEN '2. AM peak (6–10)' WHEN SEQ4() < 14 THEN '3. Midday (10–14)' WHEN SEQ4() < 18 THEN '4. PM peak (14–18)'
      WHEN SEQ4() < 21 THEN '5. Evening (18–21)' ELSE '6. Late (21–24)' END AS HOUR_BAND FROM TABLE(GENERATOR(ROWCOUNT
      => 24))
    description: 'Conformed hour-of-day dimension (24 rows, 00:00–23:00): joins Service and Fleet so time-of-day filters reach both.'
    fields:
      - name: HOUR_KEY
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOUR_KEY"'
      - name: HOUR_BAND
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOUR_BAND"'
  - name: Line Stops
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."TH_LINE_STOPS"'
    fields:
      - name: Line
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE"'
      - name: Stop Id
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_ID"'
      - name: Stop Lat
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LAT"'
      - name: Stop Lon
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LON"'
      - name: Stop Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LABEL"'
      - name: Line Stop Id
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE_STOP_ID"'
      - name: Stop Sequence
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_SEQUENCE"'
      - name: Weekday Calls
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_CALLS"'
      - name: Route Stop
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LABEL"'
        dimension: {}
        description: A stop on the selected line.
        ai_context:
          instructions: A stop on the selected line.
  - name: Lines
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."TH_LINES"'
    fields:
      - name: City
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CITY"'
      - name: Line
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE"'
        dimension: {}
        description: OSETH line number (route_short_name), e.g. 01X, 31, 52.
        ai_context:
          instructions: OSETH line number (route_short_name), e.g. 01X, 31, 52.
      - name: Category
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
      - name: Route Km
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ROUTE_KM"'
      - name: Line Name
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE_NAME"'
        dimension: {}
        description: Route name in Greek as published by OSETH.
        ai_context:
          instructions: Route name in Greek as published by OSETH.
      - name: Line Color
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE_COLOR"'
      - name: Line Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE_LABEL"'
        dimension: {}
        description: Line number and English route name.
        ai_context:
          instructions: Line number and English route name.
      - name: Span Hours
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SPAN_HOURS"'
      - name: Speed Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SPEED_BAND"'
        dimension: {}
        description: Scheduled commercial speed of a typical weekday trip.
        ai_context:
          instructions: Scheduled commercial speed of a typical weekday trip.
      - name: Line Name En
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE_NAME_EN"'
      - name: Stops Served
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOPS_SERVED"'
      - name: Trip Minutes
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TRIP_MINUTES"'
      - name: Avg Speed Kmh
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AVG_SPEED_KMH"'
      - name: Weekday Trips
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_TRIPS"'
      - name: Frequency Tier
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FREQUENCY_TIER"'
        dimension: {}
        description: 'Weekday 07–10 headway in the main direction: ≤10, 11–20, 21–40, >40 min, or no AM service.'
        ai_context:
          instructions: 'Weekday 07–10 headway in the main direction: ≤10, 11–20, 21–40, >40 min, or no AM service.'
      - name: Last Departure
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LAST_DEPARTURE"'
      - name: First Departure
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FIRST_DEPARTURE"'
      - name: Buses On Road 8am
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BUSES_ON_ROAD_8AM"'
      - name: Midday Headway Min
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"MIDDAY_HEADWAY_MIN"'
      - name: AM Peak Headway Min
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AM_PEAK_HEADWAY_MIN"'
      - name: Line Category
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CATEGORY"'
        dimension: {}
        description: >-
          Urban core (<50), Suburban (50–79), Regional (80+), Night (…N), Airport (01X/01N). Approximate grouping from
          the line number.
        ai_context:
          instructions: >-
            Urban core (<50), Suburban (50–79), Regional (80+), Night (…N), Airport (01X/01N). Approximate grouping from
            the line number.
      - name: Line City
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CITY"'
        dimension: {}
        description: 'Constant: Thessaloniki. Anchors network totals.'
        ai_context:
          instructions: 'Constant: Thessaloniki. Anchors network totals.'
  - name: Service
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."TH_SERVICE"'
    fields:
      - name: Hour
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOUR_LABEL"'
        dimension: {}
        description: Hour of day the trip departs its first stop (00:00 … 23:00).
        ai_context:
          instructions: Hour of day the trip departs its first stop (00:00 … 23:00).
      - name: Line
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINE"'
      - name: Trips
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TRIPS"'
      - name: Dow Num
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DOW_NUM"'
      - name: Is Peak
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_PEAK"'
      - name: Day Type
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAY_TYPE"'
        dimension: {}
        description: Weekday, Saturday or Sunday.
        ai_context:
          instructions: Weekday, Saturday or Sunday.
      - name: Day Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAY_LABEL"'
      - name: Time Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TIME_BAND"'
        dimension: {}
        description: Night 0–6, AM peak 6–10, Midday 10–14, PM peak 14–18, Evening 18–21, Late 21–24.
        ai_context:
          instructions: Night 0–6, AM peak 6–10, Midday 10–14, PM peak 14–18, Evening 18–21, Late 21–24.
      - name: Date Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DATE_LABEL"'
      - name: Hour Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOUR_LABEL"'
      - name: Stop Calls
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_CALLS"'
      - name: Vehicle Km
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VEHICLE_KM"'
      - name: Day Of Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAY_OF_WEEK"'
      - name: Service Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SERVICE_DATE"'
        dimension:
          is_time: true
        description: Calendar date of scheduled service, 14 Jul – 3 Aug 2026.
        ai_context:
          instructions: Calendar date of scheduled service, 14 Jul – 3 Aug 2026.
      - name: Service Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SERVICE_WEEK"'
        dimension: {}
        description: Week 1–3 of the timetable period, Tuesday to Monday.
        ai_context:
          instructions: Week 1–3 of the timetable period, Tuesday to Monday.
      - name: Vehicle Hours
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VEHICLE_HOURS"'
      - name: Day of Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAY_OF_WEEK"'
        dimension: {}
        description: Mon … Sun (sort by Day Order).
        ai_context:
          instructions: Mon … Sun (sort by Day Order).
      - name: Service Day
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DATE_LABEL"'
        dimension: {}
        description: MM-DD and weekday, sorts in date order.
        ai_context:
          instructions: MM-DD and weekday, sorts in date order.
      - name: Weekday
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DAY_LABEL"'
        dimension: {}
        description: 1 Mon … 7 Sun, sorts in week order.
        ai_context:
          instructions: 1 Mon … 7 Sun, sorts in week order.
  - name: Stops
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."TH_STOPS"'
    fields:
      - name: Lat
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LAT"'
      - name: Lon
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LON"'
      - name: City
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CITY"'
      - name: Sector
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SECTOR"'
        dimension: {}
        description: Compass sector from Aristotelous Square; Centre within 2 km.
        ai_context:
          instructions: Compass sector from Aristotelous Square; Centre within 2 km.
      - name: Stop Id
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_ID"'
      - name: Dist Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DIST_BAND"'
      - name: Stop Code
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_CODE"'
      - name: Stop Name
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_NAME"'
      - name: Stop Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LABEL"'
      - name: Is Frequent
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_FREQUENT"'
      - name: Connectivity
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CONNECTIVITY"'
        dimension: {}
        description: Number of lines calling at the stop.
        ai_context:
          instructions: Number of lines calling at the stop.
      - name: Stop Name En
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_NAME_EN"'
      - name: Lines Serving
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LINES_SERVING"'
      - name: Service Level
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SERVICE_LEVEL"'
        dimension: {}
        description: Weekday 07–10 departures per hour at the stop, all lines.
        ai_context:
          instructions: Weekday 07–10 departures per hour at the stop, all lines.
      - name: Dist Centre Km
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DIST_CENTRE_KM"'
      - name: Is Underserved
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"IS_UNDERSERVED"'
      - name: No Sunday Service
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"NO_SUNDAY_SERVICE"'
      - name: Sunday Departures
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SUNDAY_DEPARTURES"'
      - name: Weekday Departures
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_DEPARTURES"'
      - name: Saturday Departures
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SATURDAY_DEPARTURES"'
      - name: AM Peak Buses Per Hour
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AM_PEAK_BUSES_PER_HOUR"'
      - name: Longest Daytime Gap Min
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LONGEST_DAYTIME_GAP_MIN"'
      - name: Distance Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DIST_BAND"'
        dimension: {}
        description: Straight-line distance from Aristotelous Square.
        ai_context:
          instructions: Straight-line distance from Aristotelous Square.
      - name: Stop
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_LABEL"'
        dimension: {}
        description: Stop name (English transliteration) · stop code.
        ai_context:
          instructions: Stop name (English transliteration) · stop code.
      - name: Stop City
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CITY"'
        dimension: {}
        description: 'Constant: Thessaloniki. Anchors stop totals.'
        ai_context:
          instructions: 'Constant: Thessaloniki. Anchors stop totals.'
      - name: Stop Name (Greek)
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STOP_NAME"'
        dimension: {}
        description: Stop name in Greek.
        ai_context:
          instructions: Stop name in Greek.
relationships:
  - name: relationship_1_Fleet_to_Categories
    from: Fleet
    to: Categories
    from_columns:
      - Category
    to_columns:
      - CATEGORY_KEY
  - name: relationship_2_Lines_to_Categories
    from: Lines
    to: Categories
    from_columns:
      - Category
    to_columns:
      - CATEGORY_KEY
  - name: relationship_3_Fleet_to_Hours
    from: Fleet
    to: Hours
    from_columns:
      - Clock Hour
    to_columns:
      - HOUR_KEY
  - name: relationship_4_Service_to_Hours
    from: Service
    to: Hours
    from_columns:
      - Hour Label
    to_columns:
      - HOUR_KEY
  - name: relationship_5_Line Stops_to_Lines
    from: Line Stops
    to: Lines
    from_columns:
      - Line
    to_columns:
      - Line
  - name: relationship_6_Line Stops_to_Stops
    from: Line Stops
    to: Stops
    from_columns:
      - Stop Id
    to_columns:
      - Stop Id
  - name: relationship_7_Service_to_Lines
    from: Service
    to: Lines
    from_columns:
      - Line
    to_columns:
      - Line
metrics:
  - name: AM Buses per Hour
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v7_AM_PEAK_BUSES_PER_HOUR")
    description: Mean weekday 07–10 buses per hour at a stop.
    ai_context:
      instructions: Mean weekday 07–10 buses per hour at a stop.
  - name: AM Headway
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v5_AM_PEAK_HEADWAY_MIN")
    description: Mean weekday 07–10 headway, minutes (main direction).
    ai_context:
      instructions: Mean weekday 07–10 headway, minutes (main direction).
  - name: Active Lines
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: COUNT(DISTINCT "v6_LINE")
    description: Lines with at least one scheduled trip in scope.
    ai_context:
      instructions: Lines with at least one scheduled trip in scope.
  - name: Avg Longest Gap
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v7_LONGEST_DAYTIME_GAP_MIN")
    description: Mean longest daytime gap across stops, minutes.
    ai_context:
      instructions: Mean longest daytime gap across stops, minutes.
  - name: Avg Route Km
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v5_ROUTE_KM")
    description: Mean typical route length, km.
    ai_context:
      instructions: Mean typical route length, km.
  - name: Avg Trip Km
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v6_VEHICLE_KM") / NULLIF(SUM("v6_TRIPS"), 0)
    description: Vehicle-km ÷ trips.
    ai_context:
      instructions: Vehicle-km ÷ trips.
  - name: Avg Trip Minutes
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v6_VEHICLE_HOURS") * 60 / NULLIF(SUM("v6_TRIPS"), 0)
    description: Vehicle-hours × 60 ÷ trips.
    ai_context:
      instructions: Vehicle-hours × 60 ÷ trips.
  - name: Buses at 8am
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v5_BUSES_ON_ROAD_8AM")
    description: Buses in service at 08:00 on the reference weekday.
    ai_context:
      instructions: Buses in service at 08:00 on the reference weekday.
  - name: Buses in Service
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v2_BUSES_ACTIVE") / NULLIF(COUNT(DISTINCT "v2_MINUTE_OF_DAY"), 0)
    description: >-
      Average buses on the road per minute in scope: SUM(buses active) ÷ COUNT DISTINCT(minute). Additive across
      categories.
    ai_context:
      instructions: >-
        Average buses on the road per minute in scope: SUM(buses active) ÷ COUNT DISTINCT(minute). Additive across
        categories.
  - name: Commercial Speed
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v6_VEHICLE_KM") / NULLIF(SUM("v6_VEHICLE_HOURS"), 0)
    description: Scheduled vehicle-km ÷ vehicle-hours (km/h).
    ai_context:
      instructions: Scheduled vehicle-km ÷ vehicle-hours (km/h).
  - name: Day Order
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: MIN("v6_DOW_NUM")
    description: Monday = 1 … Sunday = 7, for sorting.
    ai_context:
      instructions: Monday = 1 … Sunday = 7, for sorting.
  - name: Departures per Stop
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v7_WEEKDAY_DEPARTURES") / NULLIF(COUNT(DISTINCT "v7_STOP_ID"), 0)
    description: Weekday departures ÷ stops.
    ai_context:
      instructions: Weekday departures ÷ stops.
  - name: Distance from Centre
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v7_DIST_CENTRE_KM")
    description: Mean straight-line km from Aristotelous Square.
    ai_context:
      instructions: Mean straight-line km from Aristotelous Square.
  - name: First Bus
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: MIN("v5_FIRST_DEPARTURE")
    description: Earliest weekday departure.
    ai_context:
      instructions: Earliest weekday departure.
  - name: Frequent Stop Share
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v7_IS_FREQUENT") / NULLIF(COUNT(DISTINCT "v7_STOP_ID"), 0)
    description: Frequent stops ÷ stops.
    ai_context:
      instructions: Frequent stops ÷ stops.
  - name: Frequent Stops
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v7_IS_FREQUENT")
    description: Stops with ≥6 buses an hour in the weekday AM peak.
    ai_context:
      instructions: Stops with ≥6 buses an hour in the weekday AM peak.
  - name: Last Bus
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: MAX("v5_LAST_DEPARTURE")
    description: Latest weekday departure.
    ai_context:
      instructions: Latest weekday departure.
  - name: Line Color
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: MAX("v5_LINE_COLOR")
    description: OSETH route colour.
    ai_context:
      instructions: OSETH route colour.
  - name: Line Speed
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v5_AVG_SPEED_KMH")
    description: Mean scheduled speed of a typical weekday trip, km/h.
    ai_context:
      instructions: Mean scheduled speed of a typical weekday trip, km/h.
