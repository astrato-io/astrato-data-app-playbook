              "source": {
                "statement": "SELECT LPAD(SEQ4()::STRING, 2, '0') || ':00' AS HOUR_KEY, CASE WHEN SEQ4() < 6 THEN '1. Night (0–6)' WHEN SEQ4() < 10 THEN '2. AM peak (6–10)' WHEN SEQ4() < 14 THEN '3. Midday (10–14)' WHEN SEQ4() < 18 THEN '4. PM peak (14–18)' WHEN SEQ4() < 21 THEN '5. Evening (18–21)' ELSE '6. Late (21–24)' END AS HOUR_BAND FROM TABLE(GENERATOR(ROWCOUNT => 24))",
                "type": "sql"
              }
