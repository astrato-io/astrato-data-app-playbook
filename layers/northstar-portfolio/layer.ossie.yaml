        "documentRevision": "8",
        "exportMode": "permissive",
        "formatVersion": 1,
        "measures": {
          "Approved Monitoring Submissions": {
            "compiledSql": "SELECT\n  CASE WHEN COALESCE(SUM(\n    CASE WHEN -- FILTER\n      \"v19_RECORD_TYPE\" = 'Monitoring' AND \"v19_PERIOD\" = '2026-Q3' AND \"v19_STATUS\" = 'Approved'\n    THEN \"v19_RECORD_COUNT\"\n    ELSE 0\n    END\n  ), SUM(\n    CASE WHEN -- FILTER\n      \"v19_RECORD_TYPE\" = 'Monitoring' AND \"v19_PERIOD\" = '2026-Q3' AND \"v19_STATUS\" = 'Locked'\n    THEN \"v19_RECORD_COUNT\"\n    ELSE 0\n    END\n  )) IS NULL THEN NULL ELSE COALESCE(SUM(\n    CASE WHEN -- FILTER\n      \"v19_RECORD_TYPE\" = 'Monitoring' AND \"v19_PERIOD\" = '2026-Q3' AND \"v19_STATUS\" = 'Approved'\n    THEN \"v19_RECORD_COUNT\"\n    ELSE 0\n    END\n  ), 0) + COALESCE(SUM(\n    CASE WHEN -- FILTER\n      \"v19_RECORD_TYPE\" = 'Monitoring' AND \"v19_PERIOD\" = '2026-Q3' AND \"v19_STATUS\" = 'Locked'\n    THEN \"v19_RECORD_COUNT\"\n    ELSE 0\n    END\n  ), 0) END AS m1\nFROM (\n  SELECT\n    \"v19_RECORD_COUNT\", \"v19_RECORD_TYPE\", \"v19_PERIOD\", \"v19_STATUS\"\n  FROM (\n    SELECT -- GRAIN Workflow Records\n      v19.RECORD_COUNT AS \"v19_RECORD_COUNT\",\n      v19.RECORD_TYPE AS \"v19_RECORD_TYPE\",\n      v19.PERIOD AS \"v19_PERIOD\",\n      v19.STATUS AS \"v19_STATUS\"\n    FROM ASTRATO_GALLERY.MOCK_DATA.NSC_WF_RECORDS AS v19\n  ) AS u1\n) AS u1\n;",
            "portability": "reference-only"
