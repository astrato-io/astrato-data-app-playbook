                    "arguments": [
                      {
                        "reference": {
                          "field": "Status",
                          "view": "Valuations"
                        }
                      },
                      {
                        "dataType": "string",
                        "value": "Under Review"
                      }
                    ],
                    "operator": "equals"
                  }
                }
              },
              "m3": {
                "aggregate": "COUNT",
                "arguments": [
                  {
                    "reference": {
                      "field": "Company Id",
                      "view": "Valuations"
                    }
                  }
                ],
                "filter": {
                  "expression": "{f1} AND {f2}",
                  "f1": {
                    "arguments": [
                      {
                        "reference": {
                          "field": "Quarter",
                          "view": "Valuations"
                        }
                      },
