version: 0.1.1
name: Superstore Sample
datasets:
  - name: Orders
    source: '"superstore"."orders"'
    description: >-
      Order lines from Ryan Sleeper's Super Sample Superstore extract: 12,420 lines across 5,009 orders, 2016-01-03 to
      2019-12-30.
    fields:
      - name: Sales
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"sales"'
      - name: State
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"state"'
      - name: Profit
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"profit"'
      - name: Region
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"region"'
        dimension: {}
        description: 'Sales region: Central, East, South, West.'
        ai_context:
          instructions: 'Sales region: Central, East, South, West.'
      - name: Country
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"country"'
      - name: Segment
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"segment"'
        dimension: {}
        description: 'Customer segment: Consumer, Corporate, Home Office.'
        ai_context:
          instructions: 'Customer segment: Consumer, Corporate, Home Office.'
      - name: Category
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"category"'
        dimension: {}
        description: 'Product category: Furniture, Office Supplies, Technology.'
        ai_context:
          instructions: 'Product category: Furniture, Office Supplies, Technology.'
      - name: Discount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"discount"'
      - name: Order ID
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"order_id"'
      - name: Quantity
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"quantity"'
      - name: Returned
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"returned"'
      - name: Ship Date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"ship_date"'
      - name: Ship Mode
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"ship_mode"'
      - name: Order Date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"order_date"'
        dimension:
          is_time: true
        description: >-
          Date the order was placed. 2016-01-03 to 2019-12-30 - the extract's own dates, not the source workbook's
          four-year shift.
        ai_context:
          instructions: >-
            Date the order was placed. 2016-01-03 to 2019-12-30 - the extract's own dates, not the source workbook's
            four-year shift.
      - name: Product Name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"product_name"'
      - name: Sub-Category
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"sub_category"'
        dimension: {}
        description: The seventeen product sub-categories. Machines and Tables are the loss-makers.
        ai_context:
          instructions: The seventeen product sub-categories. Machines and Tables are the loss-makers.
      - name: Customer Name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: '"customer_name"'
metrics:
  - name: Orders
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT "v1_order_id")
    description: >-
      Distinct orders. An order has many lines, so this is a distinct count of Order ID, not a row count: 12,420 lines
      across 5,009 orders.
    ai_context:
      instructions: >-
        Distinct orders. An order has many lines, so this is a distinct count of Order ID, not a row count: 12,420 lines
        across 5,009 orders.
  - name: Profit
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM("v1_profit")
    description: Profit on order lines, in USD. Negative on discounted furniture and on most of the Machines sub-category.
    ai_context:
      instructions: Profit on order lines, in USD. Negative on discounted furniture and on most of the Machines sub-category.
  - name: Profit Ratio
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM("v1_profit") / NULLIF(SUM("v1_sales"), 0)::Nullable(Float64)
    description: >-
      Profit as a share of sales. Both operands are Float64 in ClickHouse, not Decimal, so the division keeps its
      precision.
    ai_context:
      instructions: >-
        Profit as a share of sales. Both operands are Float64 in ClickHouse, not Decimal, so the division keeps its
        precision.
  - name: Returns
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: >-
            -- ASTRATO_REFERENCE_ONLY_MEASURE: Returns uses advanced semantics that Apache Ossie cannot represent as one
            reusable metric expression. The engine-generated query below is context for people and AI agents; it is not
            directly executable as this metric.

            -- SELECT

            --   COUNT(DISTINCT

            --     CASE WHEN -- FILTER

            --       "v1_returned" = 'Yes'

            --     THEN "v1_order_id"

            --     END

            --   ) AS m1

            -- FROM (

            --   SELECT

            --     "v1_order_id", "v1_returned"

            --   FROM (

            --     SELECT -- GRAIN Orders

            --       v1.order_id AS "v1_order_id",

            --       v1.returned AS "v1_returned"

            --     FROM superstore.orders AS v1

            --   ) AS u1

            -- ) AS u1

            -- ;
    description: >-
      Orders with a returned line. The flag is set on every line of a returned order, never on part of one: 3,226
      flagged lines across exactly 296 orders.
    ai_context:
      instructions: >-
        Orders with a returned line. The flag is set on every line of a returned order, never on part of one: 3,226
        flagged lines across exactly 296 orders.
  - name: Sales
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM("v1_sales")
    description: Net sales value of order lines, in USD.
    ai_context:
      instructions: Net sales value of order lines, in USD.
