version: 0.1.1
name: Hospital ER Operations
datasets:
  - name: ER Visits
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."HOSPITAL_ER_V"'
    description: One row per emergency-room visit.
    fields:
      - name: Er Day
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_DAY"'
      - name: Er Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_DATE"'
      - name: Er Hour
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_HOUR"'
      - name: Er Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_WEEK"'
      - name: Er Year
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_YEAR"'
      - name: Age Band
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AGE_BAND"'
        dimension: {}
        description: Ten-year patient age band, 0-9 through 70-79.
        ai_context:
          instructions: Ten-year patient age band, 0-9 through 70-79.
      - name: Er Month
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_MONTH"'
      - name: Er Quarter
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_QUARTER"'
      - name: Patient ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_ID"'
      - name: Admin Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ADMIN_LABEL"'
      - name: Patient Age
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_AGE"'
      - name: Weekday Num
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_NUM"'
      - name: Gender Label
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"GENDER_LABEL"'
      - name: Has Referral
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HAS_REFERRAL"'
      - name: Patient Race
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_RACE"'
      - name: Weekday Name
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_NAME"'
      - name: Admin Flag Num
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ADMIN_FLAG_NUM"'
      - name: Patient Gender
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_GENDER"'
      - name: Patient Waittime
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_WAITTIME"'
      - name: Patient Last Name
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_LAST_NAME"'
      - name: Patient Sat Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_SAT_SCORE"'
      - name: Patient Admin Flag
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_ADMIN_FLAG"'
      - name: Department Referral
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"DEPARTMENT_REFERRAL"'
        dimension: {}
        description: Hospital department the patient was referred on to, or None.
        ai_context:
          instructions: Hospital department the patient was referred on to, or None.
      - name: Patient First Initial
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_FIRST_INITIAL"'
      - name: Admission Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ADMIN_LABEL"'
        dimension: {}
        description: Whether the visit ended in admission or not.
        ai_context:
          instructions: Whether the visit ended in admission or not.
      - name: Arrival Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_DAY"'
        dimension:
          is_time: true
        description: Calendar date the patient arrived at the ER.
        ai_context:
          instructions: Calendar date the patient arrived at the ER.
      - name: Arrival Month
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_MONTH"'
        dimension:
          is_time: true
        description: Month of the ER arrival.
        ai_context:
          instructions: Month of the ER arrival.
      - name: Arrival Quarter
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_QUARTER"'
        dimension:
          is_time: true
        description: Quarter of the ER arrival.
        ai_context:
          instructions: Quarter of the ER arrival.
      - name: Arrival Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_WEEK"'
        dimension:
          is_time: true
        description: Monday-starting week of the ER arrival.
        ai_context:
          instructions: Monday-starting week of the ER arrival.
      - name: Gender
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"GENDER_LABEL"'
        dimension: {}
        description: 'Patient gender: Male, Female or Non-Conforming.'
        ai_context:
          instructions: 'Patient gender: Male, Female or Non-Conforming.'
      - name: Hour of Day
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ER_HOUR"'
        dimension: {}
        description: Hour of the day the patient arrived, 0-23.
        ai_context:
          instructions: Hour of the day the patient arrived, 0-23.
      - name: Race
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"PATIENT_RACE"'
        dimension: {}
        description: Patient self-reported race.
        ai_context:
          instructions: Patient self-reported race.
      - name: Weekday
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEKDAY_NAME"'
        dimension: {}
        description: Day of the week the patient arrived.
        ai_context:
          instructions: Day of the week the patient arrived.
  - name: Er Wait Flag Events
    source: '"ASTRATO_GALLERY"."ASTRATO"."ER_WAIT_FLAG_EVENTS"'
    fields:
      - name: Note
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"note"'
      - name: Actor
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"actor"'
      - name: Action
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"action"'
      - name: Flag ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"flag_id"'
      - name: Event At
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"event_at"'
      - name: Event ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"event_id"'
      - name: To Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"to_status"'
      - name: Actor Role
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"actor_role"'
      - name: From Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"from_status"'
      - name: Event Action
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"action"'
        dimension: {}
        description: 'What they did: raised, started, resolved, closed, reopened, reassigned.'
        ai_context:
          instructions: 'What they did: raised, started, resolved, closed, reopened, reassigned.'
      - name: Event Actor
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"actor"'
        dimension: {}
        description: Who made the change.
        ai_context:
          instructions: Who made the change.
      - name: Event Flag ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"flag_id"'
        dimension: {}
        description: The flag an audit event belongs to.
        ai_context:
          instructions: The flag an audit event belongs to.
      - name: Event From Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"from_status"'
        dimension: {}
        description: Flag status before the event.
        ai_context:
          instructions: Flag status before the event.
      - name: Event Note
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"note"'
        dimension: {}
        description: The reason or note given with the change.
        ai_context:
          instructions: The reason or note given with the change.
      - name: Event Role
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"actor_role"'
        dimension: {}
        description: The role they acted in.
        ai_context:
          instructions: The role they acted in.
      - name: Event Time
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"event_at"'
        dimension:
          is_time: true
        description: When the audit event happened (UTC).
        ai_context:
          instructions: When the audit event happened (UTC).
      - name: Event To Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"to_status"'
        dimension: {}
        description: Flag status after the event.
        ai_context:
