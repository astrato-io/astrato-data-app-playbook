        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"department"'
        dimension: {}
        description: Department the flag concerns, or "Any".
        ai_context:
          instructions: Department the flag concerns, or "Any".
      - name: Flag Due Date
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"due_date"'
        dimension:
          is_time: true
        description: Date the owner is due to report back.
        ai_context:
          instructions: Date the owner is due to report back.
      - name: Flag Issue
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"issue"'
        dimension: {}
        description: What the duty manager saw.
        ai_context:
          instructions: What the duty manager saw.
      - name: Flag Owner
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"owner"'
        dimension: {}
        description: The named person who owns the follow-up.
        ai_context:
          instructions: The named person who owns the follow-up.
      - name: Flag Raised At
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"created_at"'
        dimension:
          is_time: true
        description: When the flag was raised (UTC).
        ai_context:
          instructions: When the flag was raised (UTC).
      - name: Flag Raised By
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"created_by"'
        dimension: {}
        description: Who raised the flag.
        ai_context:
          instructions: Who raised the flag.
      - name: Flag Scope
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"scope"'
        dimension: {}
        description: 'What the flag is about: a time slot or a department.'
        ai_context:
          instructions: 'What the flag is about: a time slot or a department.'
      - name: Flag Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"status"'
        dimension: {}
        description: Open, In progress, Resolved (owner done, awaiting sign-off) or Closed (signed off by the ED operations lead).
        ai_context:
          instructions: >-
            Open, In progress, Resolved (owner done, awaiting sign-off) or Closed (signed off by the ED operations
