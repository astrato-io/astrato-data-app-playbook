          instructions: When the flag last changed (UTC).
      - name: Flag Weekday
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"weekday"'
        dimension: {}
        description: Weekday of the flagged time slot, or "Any".
        ai_context:
          instructions: Weekday of the flagged time slot, or "Any".
metrics:
  - name: Admission Rate
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v1_ADMIN_FLAG_NUM")
    description: Share of ER visits that resulted in admission (average of the 0/1 admission flag).
    ai_context:
      instructions: Share of ER visits that resulted in admission (average of the 0/1 admission flag).
  - name: Admitted Patients
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: SUM("v1_ADMIN_FLAG_NUM")
    description: Number of visits that resulted in the patient being admitted.
    ai_context:
      instructions: Number of visits that resulted in the patient being admitted.
  - name: Avg Patient Age
    expression:
      dialects:
        - dialect: SNOWFLAKE
