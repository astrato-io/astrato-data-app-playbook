version: 0.1.1
name: Ski Resort Operations
datasets:
  - name: Data Sources
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."SKI_SOURCES"'
    description: Reference. Where each input came from and its status. Not joined to the facts.
    fields:
      - name: Url
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"URL"'
      - name: Source
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SOURCE"'
      - name: Status
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"STATUS"'
      - name: Use In Prototype
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"USE_IN_PROTOTYPE"'
  - name: Resort Weeks
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."SKI_RESORT_WEEKS"'
    description: >-
      Fact. One row per resort per season week (10 resorts x 36 weeks = 360 rows). Snow conditions, weather, crowding,
      prices and the precomputed suitability scores for that resort in that week.
    fields:
      - name: Week ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEK_ID"'
      - name: Wind Kph
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WIND_KPH"'
      - name: Resort ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"RESORT_ID"'
      - name: Avg Temp C
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AVG_TEMP_C"'
      - name: Snow Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SNOW_SCORE"'
      - name: Crowd Index
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"CROWD_INDEX"'
      - name: Quiet Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"QUIET_SCORE"'
      - name: Value Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VALUE_SCORE"'
      - name: Expert Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPERT_SCORE"'
      - name: Family Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FAMILY_SCORE"'
      - name: Base Depth Cm
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BASE_DEPTH_CM"'
      - name: Bluebird Days
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BLUEBIRD_DAYS"'
      - name: Explorer Score
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"EXPLORER_SCORE"'
      - name: Lodging 7N Eur
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LODGING_7N_EUR"'
      - name: Snowfall 7D Cm
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SNOWFALL_7D_CM"'
      - name: Total Week Eur
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TOTAL_WEEK_EUR"'
      - name: Open Terrain Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"OPEN_TERRAIN_PCT"'
      - name: Lift Pass Day Eur
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LIFT_PASS_DAY_EUR"'
  - name: Resorts
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."SKI_RESORTS"'
    description: >-
      Dimension. One row per ski resort (10): location, elevation, terrain size, lift count, slope mix, snowmaking and
      airport access.
    fields:
      - name: Country
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"COUNTRY"'
        dimension: {}
        description: Country the resort is in (France, Switzerland, Austria, Italy, Germany).
        ai_context:
          instructions: Country the resort is in (France, Switzerland, Austria, Italy, Germany).
      - name: Latitude
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LATITUDE"'
      - name: Longitude
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LONGITUDE"'
      - name: Resort ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"RESORT_ID"'
      - name: Lift Count
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"LIFT_COUNT"'
      - name: Skiable Km
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SKIABLE_KM"'
      - name: Resort Name
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"RESORT_NAME"'
      - name: Advanced Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"ADVANCED_PCT"'
      - name: Beginner Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BEGINNER_PCT"'
      - name: Snowmaking Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SNOWMAKING_PCT"'
      - name: Family Lift Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"FAMILY_LIFT_PCT"'
      - name: Gateway Airport
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"GATEWAY_AIRPORT"'
        dimension: {}
        description: 'The airport guests fly into for this resort: the natural market for flight-based marketing.'
        ai_context:
          instructions: 'The airport guests fly into for this resort: the natural market for flight-based marketing.'
      - name: Top Elevation M
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"TOP_ELEVATION_M"'
      - name: Vertical Drop M
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"VERTICAL_DROP_M"'
      - name: Base Elevation M
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"BASE_ELEVATION_M"'
      - name: Intermediate Pct
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"INTERMEDIATE_PCT"'
      - name: Airport Transfer Min
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"AIRPORT_TRANSFER_MIN"'
      - name: Resort
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"RESORT_NAME"'
        dimension: {}
        description: The ski resort (10 resorts, all fictional).
        ai_context:
          instructions: The ski resort (10 resorts, all fictional).
  - name: Score Weights
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."SKI_ASSUMPTIONS"'
    description: Reference. The weight and interpretation of each component in the suitability scores. Not joined to the facts.
    fields:
      - name: Weight
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEIGHT"'
      - name: Interpretation
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"INTERPRETATION"'
      - name: Score Component
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SCORE_COMPONENT"'
  - name: Season Weeks
    source: '"ASTRATO_GALLERY"."MOCK_DATA"."SKI_WEEKS"'
    description: >-
      Dimension. One row per week of the season calendar (36 weeks): season, week start date, week number in the season,
      month, season phase and holiday flag.
    fields:
      - name: Month
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEK_START"'
        dimension:
          is_time: true
        description: Calendar month of the week's start date. Sorts in time order, unlike the Month text field.
        ai_context:
          instructions: Calendar month of the week's start date. Sorts in time order, unlike the Month text field.
      - name: Season
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SEASON"'
        dimension: {}
        description: 'Ski season, December to March: 2024/25 or 2025/26.'
        ai_context:
          instructions: 'Ski season, December to March: 2024/25 or 2025/26.'
      - name: Week ID
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEK_ID"'
      - name: Week Start
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEK_START"'
      - name: Season Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SEASON_WEEK"'
        dimension: {}
        description: >-
          Week number within the season, 1 (first week of December) to 18 (last week of March). Lines up the two seasons
          week by week.
        ai_context:
          instructions: >-
            Week number within the season, 1 (first week of December) to 18 (last week of March). Lines up the two
            seasons week by week.
      - name: Holiday Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"HOLIDAY_WEEK"'
      - name: Season Phase
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"SEASON_PHASE"'
        dimension: {}
        description: >-
          Part of the season: Early season (weeks 1-3), Peak winter (4-8), Mid winter (9-13), Spring (14-18). Sorts
          alphabetically; order charts by First Season Week.
        ai_context:
          instructions: >-
            Part of the season: Early season (weeks 1-3), Peak winter (4-8), Mid winter (9-13), Spring (14-18). Sorts
            alphabetically; order charts by First Season Week.
      - name: Week
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: '"WEEK_START"'
        dimension:
          is_time: true
        description: Calendar week, by its Monday start date. One row per week.
        ai_context:
          instructions: Calendar week, by its Monday start date. One row per week.
relationships:
  - name: relationship_1_Resort Weeks_to_Resorts
    from: Resort Weeks
    to: Resorts
    from_columns:
      - Resort ID
    to_columns:
      - Resort ID
  - name: relationship_2_Resort Weeks_to_Season Weeks
    from: Resort Weeks
    to: Season Weeks
    from_columns:
      - Week ID
    to_columns:
      - Week ID
metrics:
  - name: Avg Base Depth
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_BASE_DEPTH_CM")
    description: 'Average snow base depth in cm. A snapshot per week: averaged, never summed. Up is good.'
    ai_context:
      instructions: 'Average snow base depth in cm. A snapshot per week: averaged, never summed. Up is good.'
  - name: Avg Crowd Index
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_CROWD_INDEX")
    description: >-
      Average Crowd Index (0-100): the only demand signal in the data, used as the proxy for visits. There is no visitor
      count. Up is good for the operator.
    ai_context:
      instructions: >-
        Average Crowd Index (0-100): the only demand signal in the data, used as the proxy for visits. There is no
        visitor count. Up is good for the operator.
  - name: Avg Expert Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_EXPERT_SCORE")
    description: 'Average expert score (0-100): advanced terrain, vertical drop, snow depth. Weight 15%.'
    ai_context:
      instructions: 'Average expert score (0-100): advanced terrain, vertical drop, snow depth. Weight 15%.'
  - name: Avg Family Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_FAMILY_SCORE")
    description: 'Average family score (0-100): beginner terrain, transfer time, lift access. Weight 10%.'
    ai_context:
      instructions: 'Average family score (0-100): beginner terrain, transfer time, lift access. Weight 10%.'
  - name: Avg Lift Pass per Day
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_LIFT_PASS_DAY_EUR")
    description: Average one-day lift pass price, in euros.
    ai_context:
      instructions: Average one-day lift pass price, in euros.
  - name: Avg Lodging 7 Nights
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_LODGING_7N_EUR")
    description: Average price of 7 nights' lodging, in euros.
    ai_context:
      instructions: Average price of 7 nights' lodging, in euros.
  - name: Avg Open Terrain
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_OPEN_TERRAIN_PCT")
    description: Average share of the resort's terrain open in the week.
    ai_context:
      instructions: Average share of the resort's terrain open in the week.
  - name: Avg Quiet Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_QUIET_SCORE")
    description: 'Average quiet score (0-100): lower crowd index. Weight 15%.'
    ai_context:
      instructions: 'Average quiet score (0-100): lower crowd index. Weight 15%.'
  - name: Avg Snow Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_SNOW_SCORE")
    description: >-
      Average snow score (0-100) from recent snowfall, base depth and open terrain. Weight 35% in the Overall Week
      Score.
    ai_context:
      instructions: >-
        Average snow score (0-100) from recent snowfall, base depth and open terrain. Weight 35% in the Overall Week
        Score.
  - name: Avg Trip Cost
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_TOTAL_WEEK_EUR")
    description: Average cost of a ski week for one guest (6-day lift pass plus 7 nights lodging), in euros.
    ai_context:
      instructions: Average cost of a ski week for one guest (6-day lift pass plus 7 nights lodging), in euros.
  - name: Avg Value Score
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_VALUE_SCORE")
    description: 'Average value score (0-100): lower weekly trip cost relative to the other resorts. Weight 25%.'
    ai_context:
      instructions: 'Average value score (0-100): lower weekly trip cost relative to the other resorts. Weight 25%.'
  - name: Avg Weekly Snowfall
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: AVG("v2_SNOWFALL_7D_CM")
    description: Average fresh snow per resort-week, in cm.
