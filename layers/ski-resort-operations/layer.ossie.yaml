  - name: Demand Headroom
    expression:
      dialects:
        - dialect: SNOWFLAKE
          expression: >-
            CASE WHEN COALESCE(AVG("v2_SNOW_SCORE"), AVG("v2_CROWD_INDEX")) IS NULL THEN NULL ELSE
            COALESCE(AVG("v2_SNOW_SCORE"), 0) - COALESCE(AVG("v2_CROWD_INDEX"), 0) END
    description: >-
      Avg Snow Score minus Avg Crowd Index, in index points: how much better the snow is than the demand it draws. A
      large gap marks resorts and weeks where conditions are good but crowds are thin, which is where extra marketing
      has most room. A modelling assumption: both are 0-100 indexes, not visits.
    ai_context:
      instructions: >-
