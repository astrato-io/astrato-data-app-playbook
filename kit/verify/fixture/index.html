<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smoke fixture</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  .pane { height: 600px; padding: 16px; }
  .pane[hidden] { display: none; }
  .wide { width: 3000px; height: 20px; background: #ddd; }
</style>
</head>
<body>
<!-- A stand-in app for testing smoke.mjs. ?fail=1 makes it break in every way the test checks. -->
<div class="pane" id="overview">Overview <span id="kpi">100</span></div>
<div class="pane" id="detail" hidden>Detail</div>
<script type="module">
  import { appState } from '../app-state.js';
  const fail = new URLSearchParams(location.search).has('fail');
  const show = (id) => { for (const p of document.querySelectorAll('.pane')) p.hidden = p.id !== id; };
  appState.tab('overview', () => show('overview'));
  appState.tab('detail', () => show('detail'));
  for (const [id, tab] of [['kpi', 'overview'], ['trend', 'overview'], ['table', 'detail']]) appState.declare(id, tab);
  setTimeout(() => { appState.settle('kpi', 'rendered'); appState.query('kpi', 40); }, 200);
  setTimeout(() => { appState.settle('trend', 'rendered'); appState.mark('landing-ready'); }, 400);
  setTimeout(() => appState.settle('table', fail ? 'error' : 'rendered', { message: 'query refused' }), 600);
  appState.check('selection moves the KPI', async () => {
    const before = document.getElementById('kpi').textContent;
    if (!fail) document.getElementById('kpi').textContent = '42';
    appState.query('kpi', 35);
    return { pass: document.getElementById('kpi').textContent !== before, detail: `${before} -> ${document.getElementById('kpi').textContent}` };
  });
  // Export probe: a tiny uncompressed .xlsx. With ?fail=1 the Detail sheet (a hidden tab) ignores
  // the filter, as real apps do when hidden tabs' selection groups are not synced before export.
  let region = null;
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc32 = (b) => { let c = 0xffffffff; for (const x of b) c = crcTable[(c ^ x) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };
  const zip = (files) => {
    const enc = new TextEncoder(), parts = [], dir = [];
    let off = 0;
    for (const [name, text] of files) {
      const n = enc.encode(name), d = enc.encode(text), crc = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [14, crc, 4], [18, d.length, 4], [22, d.length, 4], [26, n.length, 2]].forEach(([o, v, s]) => s === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
      const c = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [16, crc, 4], [20, d.length, 4], [24, d.length, 4], [28, n.length, 2], [42, off, 4]].forEach(([o, v, s]) => s === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
      parts.push(h, n, d); dir.push(c, n); off += 30 + n.length + d.length;
    }
    const size = dir.reduce((s, p) => s + p.byteLength, 0);
    const e = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, off, 4]].forEach(([o, v, s]) => s === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
    return new Blob([...parts, ...dir, e]);
  };
  const sheet = (rows) => `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r, i) => `<row r="${i + 1}">${r.map((v) => typeof v === 'number' ? `<c><v>${v}</v></c>` : `<c t="inlineStr"><is><t>${v}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const data = { North: [40, 12], South: [60, 30] };
  const pick = (r) => (r ? [data[r]] : Object.values(data));
  const buildWorkbook = () => {
    const names = ['Overview', 'Detail', 'Definitions'];
    const rows = [
      [[`Filters: ${region ?? 'none'}`], ...pick(region)],
      [[`Filters: ${region ?? 'none'}`], ...pick(fail ? null : region)],
      [['Term', 'Meaning'], ['Sales', 'Sum of sales']],
    ];
    return zip([
      ['[Content_Types].xml', '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"/>'],
      ['xl/workbook.xml', `<workbook xmlns:r="r"><sheets>${names.map((n, i) => `<sheet name="${n}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
      ['xl/_rels/workbook.xml.rels', `<Relationships>${names.map((n, i) => `<Relationship Id="rId${i + 1}" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}</Relationships>`],
      ...rows.map((r, i) => [`xl/worksheets/sheet${i + 1}.xml`, sheet(r)]),
    ]);
  };
  appState.exportProbe({ build: buildWorkbook, select: () => { region = 'North'; }, clear: () => { region = null; }, exempt: ['Definitions'] });
  if (fail) {
    console.error('fixture console error');
    fetch('./missing.json').catch(() => {});
    document.getElementById('detail').insertAdjacentHTML('beforeend', '<p>Visualization failed to render</p><div class="wide"></div>');
  }
</script>
</body>
</html>
